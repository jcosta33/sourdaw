jni = { path = "vendor/rust/jni-0.22.4" }
android-build = { path = "vendor/rust/android-build-0.1.4" }
windows-implement = { path = "vendor/rust/windows-implement-0.100.0" }
windows-interface = { path = "vendor/rust/windows-interface-0.100.0" }
jni-macros = { path = "vendor/rust/jni-macros-0.22.4" }
jni-sys-macros = { path = "vendor/rust/jni-sys-macros-0.4.1" }
zerocopy-derive = { path = "vendor/rust/zerocopy-derive-0.8.63" }
criterion = { path = "vendor/rust/criterion-0.8.2" }
criterion-plot = { path = "vendor/rust/criterion-plot-0.8.2" }
symphonia-format-riff = { path = "vendor/rust/symphonia-format-riff-0.6.1" }
redox_users = { path = "vendor/rust/redox_users-0.5.3" }
ndk = { path = "vendor/rust/ndk-0.9.0" }
