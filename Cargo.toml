[workspace]
members = [
    "crates/daw-core",
    "crates/daw-collab",
    "crates/daw-engine",
    "crates/daw-dsp",
    "crates/daw-io",
    "crates/daw-wasm-decoder",
    "crates/daw-plugin-host",
    "crates/proof-chamber",
    "crates/scoring",
    "crates/sourdaw-harness-tone",
    "crates/sourdaw-native"
]
resolver = "2"

[workspace.package]
authors = ["Jose Costa"]
license = "Apache-2.0"
repository = "https://github.com/jcosta33/sourdaw"

[workspace.dependencies]
# The Windows device layer (ADR 0027) reaches IAudioClient3 and WASAPI
# Exclusive through the platform's own bindings. Pinned to the version
# already present in the lockfile through cpal's Windows dependency tree,
# so both resolve to one copy.
windows = "0.62.2"

# Workspace lint policy. Every crate opts in with `[lints] workspace = true`.
# A lint with zero violations is denied. PR clippy enforces it on host-target
# code only: Linux for every crate but sourdaw-native (health-gates-rust.sh),
# macOS for sourdaw-native (native-macos). Windows-only and wasm32-only code is
# not clippy-linted yet (#6528). The `warn` entries are pending cleanup tracked
# in #6525: shrink that list as sites are fixed, never grow it.
[workspace.lints.rust]
unused = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
dead_code = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_assignments = "warn"
unused_mut = "warn"
unused_variables = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
get_unwrap = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
await_holding_lock = "warn"
bool_assert_comparison = "warn"
chunks_exact_to_as_chunks = "warn"
default_constructed_unit_structs = "warn"
derivable_impls = "warn"
empty_line_after_doc_comments = "warn"
excessive_precision = "warn"
field_reassign_with_default = "warn"
if_same_then_else = "warn"
int_plus_one = "warn"
large_enum_variant = "warn"
len_without_is_empty = "warn"
manual_clamp = "warn"
manual_div_ceil = "warn"
manual_is_multiple_of = "warn"
manual_range_contains = "warn"
manual_repeat_n = "warn"
needless_borrows_for_generic_args = "warn"
needless_lifetimes = "warn"
needless_range_loop = "warn"
neg_cmp_op_on_partial_ord = "warn"
new_ret_no_self = "warn"
new_without_default = "warn"
panic = "warn"
result_large_err = "warn"
result_unit_err = "warn"
should_implement_trait = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
unnecessary_cast = "warn"
useless_conversion = "warn"
vec_box = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 16
split-debuginfo = "unpacked"

# WB-6 — panic behaviour of the wasm DSP builds.
#
# The `wasm32-unknown-unknown` target already ships with `panic-strategy =
# "abort"` (verified: `rustc --target wasm32-unknown-unknown --print
# target-spec-json` reports `"panic-strategy": "abort"`), so every wasm release
# build produced by `wasm-pack` aborts on panic — a panic traps to
# `unreachable` and definitively kills the instance rather than leaving it
# half-alive. The missing half of WB-6 was *identifiability*, which is now
# provided by the per-crate `console_error_panic_hook` installed at wasm module
# init.
#
# `panic = "abort"` is deliberately NOT set on this shared release profile:
# Cargo profiles cannot be scoped by target, so setting it here would also
# switch the native CPAL build from unwinding to aborting — an out-of-scope
# change to desktop crash semantics (loss of unwind-based isolation around
# native command dispatch). The native build keeps its default unwind
# strategy; the wasm build is abort-by-target with a loud panic hook.
