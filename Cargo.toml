[workspace]
members = [
    "crates/daw-core",
    "crates/daw-collab",
    "crates/daw-engine",
    "crates/daw-dsp",
    "crates/daw-io",
    "crates/daw-wasm-decoder",
    "crates/daw-plugin-host",
    "crates/proof-chamber",
    "crates/scoring",
    "crates/sourdaw-harness-tone",
    "crates/sourdaw-native"
]
resolver = "2"
exclude = [
    "vendor/rust/cpal-0.18.2",
    "vendor/rust/windows-0.62.2",
    "vendor/rust/reqwest-0.13.5",
    "vendor/rust/hyper-util-0.1.21",
    "vendor/rust/quinn-0.11.12",
    "vendor/rust/whisper-rs-sys-0.15.0",
    "vendor/rust/clang-sys-1.9.1",
    "vendor/rust/cexpr-0.6.0",
    "vendor/rust/tracing-attributes-0.1.31",
    "vendor/rust/visibility-0.1.1",
    "vendor/rust/num_enum_derive-0.7.6",
    "vendor/rust/ring-0.17.14",
    "vendor/rust/getrandom-0.4.3",
    "vendor/rust/flume-0.12.0",
    "vendor/rust/mio-1.2.5",
    "vendor/rust/windows-sys-0.61.2",
    "vendor/rust/hostname-0.4.2",
    "vendor/rust/libloading-0.9.1",
    "vendor/rust/parking_lot_core-0.10.0",
    "vendor/rust/jni-0.22.4",
    "vendor/rust/android-build-0.1.4",
    "vendor/rust/windows-implement-0.100.0",
    "vendor/rust/windows-interface-0.100.0",
    "vendor/rust/jni-macros-0.22.4",
    "vendor/rust/jni-sys-macros-0.4.1",
    "vendor/rust/zerocopy-derive-0.8.63",
    "vendor/rust/criterion-0.8.2",
    "vendor/rust/criterion-plot-0.8.2",
    "vendor/rust/symphonia-format-riff-0.6.1",
    "vendor/rust/redox_users-0.5.3",
    "vendor/rust/ndk-0.9.0",
    "vendor/rust/ndk-sys-0.6.0+11769913",
    "vendor/rust/midir-0.11.1",
    "vendor/rust/prettytable-0.10.0",
    "vendor/rust/test-log-core-0.2.21",
    "vendor/rust/test-log-macros-0.2.21",
    "vendor/rust/hexane-0.2.1",
    "vendor/rust/automerge-0.12.0",
]


[workspace.package]
authors = ["Jose Costa"]
license = "Apache-2.0"
repository = "https://github.com/jcosta33/sourdaw"

[workspace.dependencies]
# The Windows device layer (ADR 0027) reaches IAudioClient3 and WASAPI
# Exclusive through the platform's own bindings. Pinned to the version
# already present in the lockfile through cpal's Windows dependency tree,
# so both resolve to one copy.
windows = "0.62.2"

[patch.crates-io]
cpal = { path = "vendor/rust/cpal-0.18.2" }
windows = { path = "vendor/rust/windows-0.62.2" }
reqwest = { path = "vendor/rust/reqwest-0.13.5" }
hyper-util = { path = "vendor/rust/hyper-util-0.1.21" }
quinn = { path = "vendor/rust/quinn-0.11.12" }
whisper-rs-sys = { path = "vendor/rust/whisper-rs-sys-0.15.0" }
clang-sys = { path = "vendor/rust/clang-sys-1.9.1" }
cexpr = { path = "vendor/rust/cexpr-0.6.0" }
tracing-attributes = { path = "vendor/rust/tracing-attributes-0.1.31" }
visibility = { path = "vendor/rust/visibility-0.1.1" }
num_enum_derive = { path = "vendor/rust/num_enum_derive-0.7.6" }

ring = { path = "vendor/rust/ring-0.17.14" }
getrandom = { path = "vendor/rust/getrandom-0.4.3" }
flume = { path = "vendor/rust/flume-0.12.0" }
mio = { path = "vendor/rust/mio-1.2.5" }
windows-sys = { path = "vendor/rust/windows-sys-0.61.2" }
