[workspace]
members = [
    "crates/daw-core",
    "crates/daw-collab",
    "crates/daw-engine",
    "crates/daw-dsp",
    "crates/daw-io",
    "crates/daw-wasm-decoder",
    "crates/daw-plugin-host",
    "crates/proof-chamber",
    "crates/scoring",
    "crates/sourdaw-harness-tone",
    "crates/sourdaw-native"
]
resolver = "2"
exclude = [
    "vendor/rust/cpal-0.18.2",
    "vendor/rust/windows-0.62.2",
    "vendor/rust/reqwest-0.13.5",
    "vendor/rust/hyper-util-0.1.21",
    "vendor/rust/quinn-0.11.12",
    "vendor/rust/whisper-rs-sys-0.15.0",
    "vendor/rust/clang-sys-1.9.1",
    "vendor/rust/cexpr-0.6.0",
    "vendor/rust/tracing-attributes-0.1.31",
    "vendor/rust/visibility-0.1.1",
    "vendor/rust/num_enum_derive-0.7.6",
]


[workspace.package]
authors = ["Jose Costa"]
license = "Apache-2.0"
repository = "https://github.com/jcosta33/sourdaw"

[workspace.dependencies]
# The Windows device layer (ADR 0027) reaches IAudioClient3 and WASAPI
# Exclusive through the platform's own bindings. Pinned to the version
# already present in the lockfile through cpal's Windows dependency tree,
# so both resolve to one copy.
windows = "0.62.2"

[patch.crates-io]
cpal = { path = "vendor/rust/cpal-0.18.2" }
windows = { path = "vendor/rust/windows-0.62.2" }
reqwest = { path = "vendor/rust/reqwest-0.13.5" }
hyper-util = { path = "vendor/rust/hyper-util-0.1.21" }
quinn = { path = "vendor/rust/quinn-0.11.12" }
whisper-rs-sys = { path = "vendor/rust/whisper-rs-sys-0.15.0" }
clang-sys = { path = "vendor/rust/clang-sys-1.9.1" }
cexpr = { path = "vendor/rust/cexpr-0.6.0" }
tracing-attributes = { path = "vendor/rust/tracing-attributes-0.1.31" }
visibility = { path = "vendor/rust/visibility-0.1.1" }
num_enum_derive = { path = "vendor/rust/num_enum_derive-0.7.6" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 16
split-debuginfo = "unpacked"

# WB-6 — panic behaviour of the wasm DSP builds.
#
# The `wasm32-unknown-unknown` target already ships with `panic-strategy =
# "abort"` (verified: `rustc --target wasm32-unknown-unknown --print
# target-spec-json` reports `"panic-strategy": "abort"`), so every wasm release
# build produced by `wasm-pack` aborts on panic — a panic traps to
# `unreachable` and definitively kills the instance rather than leaving it
# half-alive. The missing half of WB-6 was *identifiability*, which is now
# provided by the per-crate `console_error_panic_hook` installed at wasm module
# init.
#
# `panic = "abort"` is deliberately NOT set on this shared release profile:
# Cargo profiles cannot be scoped by target, so setting it here would also
# switch the native CPAL build from unwinding to aborting — an out-of-scope
# change to desktop crash semantics (loss of unwind-based isolation around
# native command dispatch). The native build keeps its default unwind
# strategy; the wasm build is abort-by-target with a loud panic hook.
