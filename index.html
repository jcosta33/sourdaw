<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#020100" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Sourdaw</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
        <link rel="apple-touch-icon" href="/icon-192.png" />
        <script defer src="/entryLoadRecovery.js"></script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root">
            <main
                id="entry-startup"
                style="
                    min-height: 100vh;
                    display: grid;
                    place-items: center;
                    background: #020100;
                    color: #eee;
                    font-family: system-ui;
                    text-align: center;
                "
            >
                <section role="status" aria-labelledby="entry-startup-title" style="max-width: 28rem; padding: 1.5rem">
                    <h1 id="entry-startup-title">Starting Sourdaw</h1>
                    <p id="entry-startup-description">
                        If this screen remains, use your browser's Reload to try starting Sourdaw again.
                    </p>
                    <button id="entry-startup-reload" type="button" hidden>Reload Sourdaw</button>
                </section>
            </main>
        </div>
        <script id="sourdaw-entry" type="module" src="/src/app/main.tsx"></script>
    </body>
</html>
