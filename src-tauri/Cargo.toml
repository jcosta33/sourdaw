
[package]
name = "sourdaw"
version = "0.1.0"
description = "AI-native DAW desktop application"
authors = ["Sourdaw Team"]
edition = "2021"

[lib]
name = "sourdaw_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools", "unstable"] }
tauri-plugin-persisted-scope = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
serde_bytes = "0.11"
raw-window-handle = "0.6"
midir = "0.11"
rusb = { version = "0.9", features = ["vendored"] }
tokio = { version = "1", features = ["macros", "time", "net", "rt", "sync"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
whisper-rs = { version = "0.16", features = ["metal"] }
cpal = "0.18"
rubato = "5"
audioadapter-buffers = "5"
sha2 = "0.11"
rtrb = "0.3"
hound = "3.5"
uuid = { version = "1.23.0", features = ["v4"] }
sourdaw-native = { path = "../crates/sourdaw-native" }
daw-core = { path = "../crates/daw-core" }
daw-collab = { path = "../crates/daw-collab" }
daw-engine = { path = "../crates/daw-engine" }
daw-plugin-host = { path = "../crates/daw-plugin-host" }
daw-dsp = { path = "../crates/daw-dsp" }
daw-io = { path = "../crates/daw-io" }

[dev-dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools", "unstable", "test"] }
daw-plugin-host = { path = "../crates/daw-plugin-host", features = ["engine-owned-command-fixture"] }
