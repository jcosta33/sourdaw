
[package]
name = "sourdaw"
version = "0.1.0"
description = "AI-native DAW desktop application"
authors = ["Sourdaw Team"]
edition = "2021"

[lib]
name = "sourdaw_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-persisted-scope = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
serde_bytes = "0.11"
vst3 = "0.3"
clap-sys = "0.3"
libloading = "0.8"
raw-window-handle = "0.6"
midir = "0.10"
tokio = { version = "1", features = ["time", "net", "rt", "sync"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
whisper-rs = { version = "0.15", features = ["metal"] }
cpal = "0.15"
rubato = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rusty_link = "0.4"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
mistralrs = { version = "0.7", features = ["metal", "accelerate"] }
ndarray = "0.16"
sha2 = "0.10"
hound = "3.5"
uuid = { version = "1.23.0", features = ["v4"] }
sentry = { version = "0.34", features = ["backtrace", "panic", "debug-images"] }
specta = { version = "2.0.0-rc.20", features = ["derive"] }
tauri-specta = { version = "2.0.0-rc.20", features = ["derive", "typescript"] }
daw-core = { path = "../crates/daw-core" }
daw-collab = { path = "../crates/daw-collab" }
daw-engine = { path = "../crates/daw-engine" }
