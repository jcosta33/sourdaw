[package]
name = "webdaw"
version = "0.1.0"
description = "AI-native DAW desktop application"
authors = ["WebDAW Team"]
edition = "2021"

[lib]
name = "webdaw_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
serde_bytes = "0.11"
vst3-sys = { git = "https://github.com/RustAudio/vst3-sys.git" }
clap-sys = "0.3"
libloading = "0.8"
midir = "0.10"
tokio = { version = "1", features = ["time", "net"] }
reqwest = { version = "0.12", features = ["json"] }
whisper-rs = { version = "0.15", features = ["metal"] }
cpal = "0.15"
rubato = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rusty_link = "0.4"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
