[package]
name = "webdaw"
version = "0.1.0"
description = "AI-native DAW desktop application"
authors = ["WebDAW Team"]
edition = "2021"

[lib]
name = "webdaw_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["shell-open"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
