[[permission]]
identifier = "allow-sourdaw-commands"
description = "Allows the bundled main webview to invoke Sourdaw's registered application commands."
commands.allow = [
    "provider_gateway_request",
    "cancel_provider_gateway_request",
    "denoise_audio",
    "ensure_whisper_ready",
    "start_dictation",
    "stop_dictation",
    "read_file_bytes",
    "write_file_bytes",
    "list_directory",
    "scan_plugins",
    "get_default_plugin_paths",
    "load_plugin",
    "unload_plugin",
    "set_plugin_parameter",
    "set_plugin_bypass",
    "get_plugin_parameters",
    "get_plugin_state_bytes",
    "set_plugin_state_bytes",
    "process_plugin_audio",
    "engine_rt_diagnostics",
    "is_plugin_gui_supported",
    "open_plugin_gui",
    "close_plugin_gui",
    "list_midi_inputs",
    "open_midi_input",
    "close_midi_input",
    "open_push_transport",
    "send_push_midi",
    "write_push2_display",
    "close_push_transport",
    "enable_link",
    "disable_link",
    "set_link_tempo",
    "get_link_status",
    "link_start_playing",
    "link_stop_playing",
    "collab_create_project",
    "collab_save_bundle",
    "collab_load_bundle",
    "collab_get_document_state",
    "collab_merge_bundle",
    "collab_apply_change",
    "create_crumbs",
    "destroy_crumbs",
    "load_sample",
    "crumbs_note_on",
    "crumbs_note_off",
    "set_crumbs_param",
    "set_crumbs_mode",
    "get_waveform_peaks",
    "detect_onsets",
    "crumbs_all_sound_off",
    "get_crumbs_position",
    "detect_smart_loop_points",
    "arm_recording",
    "stop_recording",
    "analyze_pitch",
    "commit_pitch_edit",
    "parse_scl",
]
