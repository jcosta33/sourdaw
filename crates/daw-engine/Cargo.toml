[package]
name = "daw-engine"
version = "0.1.0"
edition = "2021"
description = "Real-time thread, lock-free communication, and graph processing."
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[features]
# Exposes a detached EngineHandle whose command ring can be inspected by
# downstream command tests. Production dependencies leave this disabled.
command-capture-fixture = []

[dependencies]
rtrb = "0.4"
cpal = { version = "0.18", features = [] }
daw-dsp = { version = "0.1.0", path = "../daw-dsp" }
# The Dutch Oven reverb `DutchOvenBody` hosts. A workspace member building an
# `rlib` that compiles natively; only its `js-sys` and
# `console_error_panic_hook` dependencies are target-gated to wasm32 —
# `wasm-bindgen` itself is unconditional and enters this native tree too, as
# attribute plumbing that compiles without pulling in browser glue.
proof-chamber = { version = "0.1.0", path = "../proof-chamber" }
# The chromatic tuner `ScoringBody` hosts, on the same shape as
# `proof-chamber` above: a workspace member building an `rlib` that compiles
# natively, whose `js-sys` and `console_error_panic_hook` dependencies alone
# are target-gated to wasm32, while `wasm-bindgen` is unconditional and enters
# this native tree as attribute plumbing that pulls in no browser glue.
scoring = { version = "0.1.0", path = "../scoring" }
triple_buffer = "9.0.0"

# The IAudioClient3/WASAPI device backend (ADR 0027). Target-gated so no
# other platform compiles or downloads the Windows bindings.
#
# Keep the workspace `windows` dependency on the same windows-core family that
# cpal resolves. Splitting the graph across windows-core families breaks the
# Windows build with mismatched COM types; after either dependency changes,
# verify one family remains and cross-check daw-engine for
# x86_64-pc-windows-msvc.
[dev-dependencies]
# The allocation guard for the audio-callback command drain
# (`scheduler` test module). Already in the workspace lockfile through
# daw-dsp and proof-chamber, so this adds no new external package.
assert_no_alloc = "1.1"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
