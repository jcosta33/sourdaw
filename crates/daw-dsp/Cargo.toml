[package]
name = "daw-dsp"
version = "0.1.0"
edition = "2021"
description = "Pure mathematical algorithms and DSP components for Sourdaw."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
wasm-bindgen = "=0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_no_alloc = "1.1"
# Microbenchmark harness for `benches/quantum.rs`. Dev-only on purpose: it must
# never reach the cdylib or the wasm dependency graph. `default-features =
# false` drops the plotters/rayon report stack, leaving the statistics and the
# `cargo bench` CLI.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "quantum"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# WB-6: surface Rust panics as readable JS-console diagnostics instead of an
# opaque `unreachable` trap that silently poisons the AudioWorklet instance.
# Scoped to wasm so the native build's dependency graph and panic behaviour are
# unaffected.
console_error_panic_hook = "0.1"
