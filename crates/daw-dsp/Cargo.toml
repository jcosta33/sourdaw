[package]
name = "daw-dsp"
version = "0.1.0"
edition = "2021"
description = "Pure mathematical algorithms and DSP components for Sourdaw."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
