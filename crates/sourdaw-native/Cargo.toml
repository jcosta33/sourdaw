[package]
name = "sourdaw-native"
version = "0.1.0"
description = "Sourdaw native audio, DSP and plugin-hosting addon"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"

[lib]
name = "sourdaw_native"
# `rlib` so tests and in-process consumers link the bodies directly; `cdylib`
# so the same bodies ship as a Node addon once `napi-addon` is on.
crate-type = ["cdylib", "rlib"]

# The plugin-scan leaf helper: a standalone executable so the scan policy
# never re-enters the application runtime to inspect a plugin. See its doc
# comment for why `scripts/buildNativeAddon.ts` builds this target with
# `CARGO_PROFILE_RELEASE_LTO=false` instead of the workspace's default
# `lto = true` release profile.
[[bin]]
name = "sourdaw-plugin-scan-helper"
path = "src/bin/sourdaw-plugin-scan-helper.rs"

[features]
# The napi surface is opt-in: an rlib consumer (tests, tooling) must not pull
# the Node addon registration in with it.
default = []
napi-addon = ["dep:napi", "dep:napi-derive"]

[build-dependencies]
napi-build = "2"

[dependencies]
napi = { version = "3", default-features = false, features = [
    "napi6",
    "dyn-symbols",
    "async",
    "serde-json",
], optional = true }
napi-derive = { version = "3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7.0"
raw-window-handle = "0.6"
midir = "0.11"
rusb = { version = "0.9", features = ["vendored"] }
tokio = { version = "1", features = ["macros", "time", "net", "rt", "rt-multi-thread", "sync", "fs", "io-util"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
whisper-rs = "0.16"
cpal = "0.18"
rubato = "5"
audioadapter-buffers = "5"
sha2 = "0.11"
rtrb = "0.4"
hound = "3.5"
uuid = { version = "1.23.0", features = ["v4"] }
zeroize = "1.8"
daw-core = { path = "../daw-core" }
daw-collab = { path = "../daw-collab" }
daw-engine = { path = "../daw-engine" }
daw-plugin-host = { path = "../daw-plugin-host" }
daw-dsp = { path = "../daw-dsp" }
daw-io = { path = "../daw-io" }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
# The GPU memory budget (commands/gpu_memory.rs): the default Metal device's
# `recommendedMaxWorkingSetSize`, which is what a process may keep resident on
# the GPU and is below unified memory. Only the device protocol and its
# creation function are enabled; 0.3 shares the one objc2 0.6 and
# objc2-foundation 0.3 the lockfile already resolves for cpal.
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice"] }
# Already in the dependency tree transitively; declared here so plugin folder
# containment can compare names the way APFS does (commands/filesystem/grant_registry.rs).
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }

[target.'cfg(unix)'.dependencies]
# Already in the dependency tree transitively; declared here for the
# no-follow cached-model read in commands/verified_cached_model.rs.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The shell known-folder query behind the Windows plugin scan roots
# (host/plugin_scan_policy.rs), and the file identity in the plugin registry's
# fingerprint (host/plugin_registry_store.rs), which std's unstable
# `file_index` cannot supply. The plugin scan helper's lifetime ties
# (host/plugin_scan_worker.rs): the kill-on-close job object that ends a
# helper with its spawner (`Win32_System_JobObjects`, whose job creation takes
# `Win32_Security` attributes), and the helper's own parent watch and
# self-termination (`Win32_System_Threading`). The GPU memory budget
# (commands/gpu_memory.rs) enumerates adapters through DXGI
# (`Win32_Graphics_Dxgi`, with `Win32_Graphics_Dxgi_Common` for the formats its
# types name) and asks Direct3D 12 (`Win32_Graphics_Direct3D`,
# `Win32_Graphics_Direct3D12`) whether each is unified-memory. The workspace pin daw-engine
# already resolves, so the graph keeps one windows-core family.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
assert_no_alloc = "1.1"
daw-engine = { path = "../daw-engine", features = ["command-capture-fixture"] }
daw-plugin-host = { path = "../daw-plugin-host", features = ["engine-owned-command-fixture"] }
tokio = { version = "1", features = ["macros", "time", "net", "rt", "rt-multi-thread", "sync"] }

[lints]
workspace = true
