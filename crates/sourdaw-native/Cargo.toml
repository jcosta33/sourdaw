[package]
name = "sourdaw-native"
version = "0.1.0"
description = "Sourdaw native audio, DSP and plugin-hosting addon"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"

[lib]
name = "sourdaw_native"
# `rlib` so tests and in-process consumers link the bodies directly; `cdylib`
# so the same bodies ship as a Node addon once `napi-addon` is on.
crate-type = ["cdylib", "rlib"]

[features]
# The napi surface is opt-in: an rlib consumer (tests, tooling) must not pull
# the Node addon registration in with it.
default = []
napi-addon = ["dep:napi", "dep:napi-derive"]

[build-dependencies]
napi-build = "2"

[dependencies]
napi = { version = "3", default-features = false, features = [
    "napi6",
    "dyn-symbols",
    "async",
    "serde-json",
], optional = true }
napi-derive = { version = "3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
raw-window-handle = "0.6"
midir = "0.11"
rusb = { version = "0.9", features = ["vendored"] }
tokio = { version = "1", features = ["macros", "time", "net", "rt", "rt-multi-thread", "sync", "fs", "io-util"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
whisper-rs = "0.16"
cpal = "0.18"
rubato = "5"
audioadapter-buffers = "5"
sha2 = "0.11"
rtrb = "0.4"
hound = "3.5"
uuid = { version = "1.23.0", features = ["v4"] }
zeroize = "1.8"
daw-core = { path = "../daw-core" }
daw-collab = { path = "../daw-collab" }
daw-engine = { path = "../daw-engine" }
daw-plugin-host = { path = "../daw-plugin-host" }
daw-dsp = { path = "../daw-dsp" }
daw-io = { path = "../daw-io" }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(unix)'.dependencies]
# Already in the dependency tree transitively; declared here for the
# free-space measurement (statfs/statvfs) in commands/model_download.rs.
libc = "0.2"

[dev-dependencies]
daw-plugin-host = { path = "../daw-plugin-host", features = ["engine-owned-command-fixture"] }
tokio = { version = "1", features = ["macros", "time", "net", "rt", "rt-multi-thread", "sync"] }
