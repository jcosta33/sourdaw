[package]
name = "daw-io"
version = "0.1.0"
edition = "2021"
description = "Native I/O: audio codec decode/encode, filesystem workflows."
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.6", features = ["all"] }
