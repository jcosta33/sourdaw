[package]
name = "scoring"
version = "0.1.0"
edition = "2021"
description = "Scoring — reference-grade chromatic tuner for Sourdaw"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.126"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_no_alloc = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
