[package]
name = "daw-plugin-host"
version = "0.1.0"
edition = "2021"
description = "Native plugin discovery and CLAP hosting, parameter access, and GUI lifecycle."
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[features]
engine-owned-command-fixture = []

[dependencies]
serde = { version = "1", features = ["derive"] }
clap-sys = "0.5"
libloading = "0.9"
sha2 = "0.11"
