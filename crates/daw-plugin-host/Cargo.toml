[package]
name = "daw-plugin-host"
version = "0.1.0"
edition = "2021"
description = "Native plugin discovery and CLAP/VST3 hosting, parameter access, and GUI lifecycle."
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[features]
engine-owned-command-fixture = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap-sys = "0.5"
# Rust bindings for the VST 3 API, generated from the MIT-licensed SDK headers
# (the crate's own `SDKVersionString` is "VST 3.8.0"). Pure vtable declarations:
# one dependency, no build script, no SDK checkout, and no C/C++ compilation
# unit — see .agents/decisions/0031-native-plugin-format-strategy.md and the
# third-party notice this crate's Steinberg copyright is discharged in.
vst3 = "0.3.0"
libloading = "0.9"
sha2 = "0.11"

# A VST3 editor on X11 does not run unless the host answers `IRunLoop`, and the
# whole of that contract is waiting on the plugin's own file descriptors —
# `poll(2)` and nothing else. The standard library has no descriptor readiness
# primitive, so the host run loop needs the libc declaration of it. Already in
# this workspace's tree as a direct dependency of `sourdaw-native`, so it costs
# no new package. Built on every unix so the run loop compiles and is tested
# wherever this crate is, rather than only on the platform that advertises it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# A `.vst3` bundle on macOS is a real CFBundle, and its `bundleEntry` entry
# point takes the `CFBundleRef` itself — so `libloading`, which hands back no
# such handle, cannot serve this platform and the bundle must be opened through
# CoreFoundation. Nothing else in this crate uses it.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
