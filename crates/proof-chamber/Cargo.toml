[package]
name = "proof-chamber"
version = "0.1.0"
edition = "2021"
description = "Dutch Oven — flagship Dattorro plate reverb engine for Sourdaw"
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# WB-6: surface Rust panics as readable JS-console diagnostics instead of an
# opaque `unreachable` trap that silently poisons the AudioWorklet instance.
# Scoped to wasm so the native build is unaffected.
console_error_panic_hook = "0.1"

[dev-dependencies]
assert_no_alloc = "1.1"
