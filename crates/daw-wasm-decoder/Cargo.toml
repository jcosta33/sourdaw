[package]
name = "daw-wasm-decoder"
version = "0.1.0"
edition = "2021"
description = "WASM-compiled audio file decoder (wraps daw-io symphonia decoder for browser use)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
daw-io = { path = "../daw-io" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
