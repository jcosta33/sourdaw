[package]
name = "daw-wasm-decoder"
version = "0.1.0"
edition = "2021"
description = "WASM-compiled audio file decoder (wraps daw-io symphonia decoder for browser use)."
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.127"
daw-io = { path = "../daw-io" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# WB-6: surface Rust panics as readable JS-console diagnostics instead of an
# opaque `unreachable` trap that silently poisons the decoder wasm instance.
# Scoped to wasm so the native build is unaffected.
console_error_panic_hook = "0.1"
