[package]
name = "daw-collab"
version = "0.1.0"
edition = "2021"
description = "Automerge CRDT collaboration layer for Sourdaw."
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
automerge = "0.11"
daw-core = { path = "../daw-core" }
hostname = "0.4"
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
