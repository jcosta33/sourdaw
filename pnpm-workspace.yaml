packages:
    - .

# CI defaults this to false; pin it so local freshness checks agree without
# reinstalling. Keep each checkout's installed virtual store private.
enableGlobalVirtualStore: false

# Refuse stale dependencies before scripts; automatic installs would run before
# the resource guard package script can reserve memory. Install explicitly.
verifyDepsBeforeRun: error

allowBuilds:
    esbuild: true
    core-js: false
    protobufjs: false
    unrs-resolver: false
    # Decided, not optional: pnpm refuses to run any script in the workspace
    # while an undecided dependency is present, so without this entry every
    # `pnpm typecheck` in the repository fails with ERR_PNPM_IGNORED_BUILDS.
    #
    # `true` grants nothing in practice — this Electron release ships no install
    # lifecycle script at all. Its ~300 MB platform binary is fetched by the
    # `install-electron` bin instead, which is why `desktop:dev` calls it.
    electron: true
    # Reached only through `electron-builder`'s Squirrel.Windows target, which
    # this repository does not build — the Windows target is NSIS. Its install
    # script fetches the Squirrel toolchain, so denying it costs nothing and
    # keeps a Windows-only download out of every developer's install. Same
    # reason as above for stating it at all: an undecided dependency fails every
    # script in the workspace.
    electron-winstaller: false
    # The postinstall only hard-links the native binary from the already-installed
    # platform optional dependency over the JS fallback shim — audited as fs
    # link/copy, no network. Denying it leaves every `pnpm exec ast-grep` spawning
    # a node shim that prints a stderr warning per invocation.
    '@ast-grep/cli': true

# HMR-disabled acceptance documents retain CSS and custom/error transport, but
# must not reload when that editor socket disconnects. Keep the browser control
# in e2eHmrDisconnectBoundary.spec.ts when updating or removing this patch.
patchedDependencies:
    '@rolldown/plugin-babel@0.3.1': patches/@rolldown__plugin-babel@0.3.1.patch
    'babel-plugin-react-compiler@1.0.0': patches/babel-plugin-react-compiler@1.0.0.patch
    'magicast@0.5.5': patches/magicast@0.5.5.patch
    'babel-dead-code-elimination@2.0.0': patches/babel-dead-code-elimination@2.0.0.patch
    '@tanstack/router-utils@1.163.0': patches/@tanstack__router-utils@1.163.0.patch
    '@testing-library/react@16.3.3': patches/@testing-library__react@16.3.3.patch
    '@tanstack/router-generator@1.168.0': patches/@tanstack__router-generator@1.168.0.patch
    '@tanstack/router-plugin@1.169.0': patches/@tanstack__router-plugin@1.169.0.patch
    '@testing-library/dom@10.4.2': patches/@testing-library__dom@10.4.2.patch
    'eslint-plugin-react-hooks@7.1.1': patches/eslint-plugin-react-hooks@7.1.1.patch
    '@automerge/automerge@3.5.0': patches/@automerge__automerge@3.5.0.patch
    vite@8.3.8: patches/vite@8.3.8.patch

# Upgrade Basic Pitch's whole TensorFlow.js umbrella, which pins its core,
# converter, CPU and WebGL backends to the same release as the app's WebGPU
# worker. Overriding core alone leaves incompatible backend kernels. Keep the
# complete cohort together; bundled-model inference checks its actual runtime.
overrides:
    '@rolldown/plugin-babel@0.3.1>@babel/core': 8.1.2
    '@rolldown/plugin-babel@0.3.1>@babel/plugin-transform-runtime': 8.1.2
    '@rolldown/plugin-babel@0.3.1>@babel/runtime': 8.1.2
    'babel-plugin-react-compiler@1.0.0>@babel/types': 8.1.2
    'magicast@0.5.5>@babel/parser': 8.1.2
    'magicast@0.5.5>@babel/types': 8.1.2
    'babel-dead-code-elimination@2.0.0>@babel/core': 8.1.2
    'babel-dead-code-elimination@2.0.0>@babel/parser': 8.1.2
    'babel-dead-code-elimination@2.0.0>@babel/traverse': 8.1.2
    'babel-dead-code-elimination@2.0.0>@babel/types': 8.1.2
    '@tanstack/router-utils@1.163.0>@babel/generator': 8.1.2
    '@tanstack/router-utils@1.163.0>@babel/parser': 8.1.2
    '@tanstack/router-utils@1.163.0>@babel/types': 8.1.2
    '@tanstack/router-utils@1.163.0>babel-dead-code-elimination': 2.0.0
    '@testing-library/react@16.3.3>@babel/runtime': 8.1.2
    '@tanstack/router-generator@1.168.0>@babel/types': 8.1.2
    '@tanstack/router-plugin@1.169.0>@babel/core': 8.1.2
    '@tanstack/router-plugin@1.169.0>@babel/template': 8.1.2
    '@tanstack/router-plugin@1.169.0>@babel/types': 8.1.2
    '@testing-library/dom@10.4.2>@babel/code-frame': 8.0.6
    '@testing-library/dom@10.4.2>@babel/runtime': 8.1.2
    'eslint-plugin-react-hooks@7.1.1>@babel/core': 8.1.2
    'eslint-plugin-react-hooks@7.1.1>@babel/parser': 8.1.2
    '@spotify/basic-pitch@1.0.1>@tensorflow/tfjs': 4.22.0
    # The umbrella's ES5 entry imports core-js/stable; current core-js preserves it.
    '@tensorflow/tfjs@4.22.0>core-js': 3.51.0
    'get-intrinsic@^1.0.0': 1.3.1
    # Convergence selectors pin only edges whose own ranges admit the release.
    '@jridgewell/resolve-uri@': 3.1.3
    '@rolldown/pluginutils@': 1.1.1
    'baseline-browser-mapping@': 2.11.37
    'electron-to-chromium@': 1.5.485
    'enhanced-resolve@': 5.27.0
    'mdast-util-to-hast@': 13.2.2
    'node-releases@': 2.0.64
    'semver@': 7.8.6
    'tapable@': 2.3.4
    'tldts@': 7.5.2
    'tldts-core@': 7.5.2

