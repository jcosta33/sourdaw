packages:
    - .

# CI defaults this to false; pin it so local freshness checks agree without
# reinstalling. Keep each checkout's installed virtual store private.
enableGlobalVirtualStore: false

# Refuse stale dependencies before scripts; automatic installs would run before
# the resource guard package script can reserve memory. Install explicitly.
verifyDepsBeforeRun: error

allowBuilds:
    esbuild: true
    core-js: false
    protobufjs: false
    unrs-resolver: false
    # Decided, not optional: pnpm refuses to run any script in the workspace
    # while an undecided dependency is present, so without this entry every
    # `pnpm typecheck` in the repository fails with ERR_PNPM_IGNORED_BUILDS.
    #
    # `true` grants nothing in practice — this Electron release ships no install
    # lifecycle script at all. Its ~300 MB platform binary is fetched by the
    # `install-electron` bin instead, which is why `desktop:dev` calls it.
    electron: true
    # Reached only through `electron-builder`'s Squirrel.Windows target, which
    # this repository does not build — the Windows target is NSIS. Its install
    # script fetches the Squirrel toolchain, so denying it costs nothing and
    # keeps a Windows-only download out of every developer's install. Same
    # reason as above for stating it at all: an undecided dependency fails every
    # script in the workspace.
    electron-winstaller: false
    # The postinstall only hard-links the native binary from the already-installed
    # platform optional dependency over the JS fallback shim — audited as fs
    # link/copy, no network. Denying it leaves every `pnpm exec ast-grep` spawning
    # a node shim that prints a stderr warning per invocation.
    '@ast-grep/cli': true

# HMR-disabled acceptance documents retain CSS and custom/error transport, but
# must not reload when that editor socket disconnects. Keep the browser control
# in e2eHmrDisconnectBoundary.spec.ts when updating or removing this patch.
patchedDependencies:
    vite@8.3.8: patches/vite@8.3.8.patch

# Two coexisting tfjs-core stacks are deliberate (#4466). The app pins
# tfjs-core/converter/backend-webgpu 4.22.0 exactly for its WebGPU DDSP worker;
# @spotify/basic-pitch owns the @tensorflow/tfjs 3.x umbrella, which pins
# its own 3.21.0 sub-packages under itself. Neither stack may be repinned
# tree-wide: forcing tfjs-core 4.22.0 into basic-pitch's chain breaks inference
# (its backend-webgl 3.21 reads ENGINE_COMPILE_ONLY at kernel paths core 4.22
# no longer registers, so evaluateModel rejects and polyphonic audio-to-MIDI
# returns null). Keep the stacks internally consistent and never import a
# second tfjs-core identity into a file: src/modules/BrowserAi/workers/
# tfjsInferenceWorker.ts derives its types from its own single dynamic import,
# and app code touches only basic-pitch's own exports, never @tensorflow/tfjs.

minimumReleaseAgeExclude:
    - '@eslint-react/ast@5.30.2'
    - '@eslint-react/core@5.30.2'
    - '@eslint-react/eslint-plugin@5.30.2'
    - '@eslint-react/eslint@5.30.2'
    - '@eslint-react/jsx@5.30.2'
    - '@eslint-react/shared@5.30.2'
    - '@eslint-react/var@5.30.2'
    - electron@45.3.1
    - eslint-plugin-react-dom@5.30.2
    - eslint-plugin-react-jsx@5.30.2
    - eslint-plugin-react-naming-convention@5.30.2
    - eslint-plugin-react-rsc@5.30.2
    - eslint-plugin-react-web-api@5.30.2
    - eslint-plugin-react-x@5.30.2
    - prettier@3.10.1
    - tar@7.5.23

    - '@babel/generator@7.29.14'
    - '@babel/helper-module-transforms@7.29.14'
    - '@babel/helper-string-parser@7.29.14'
    - '@babel/helpers@7.29.14'
    - '@babel/parser@7.29.14'
