name: Heavy gates

# Required affected browser checks, called once from the pull-request workflow.
# Approval does not launch another suite. The full scheduled train is nightly.yml.
on:
  workflow_call:
    inputs:
      matrix:
        description: Validated explicit E2E file groups; an empty include list selects none.
        required: true
        type: string
      browser-ai:
        description: Whether affected dependencies require hardware WebGPU proof.
        required: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: 24.19.0

jobs:
  e2e:
    name: Affected end-to-end ${{ matrix.id }}
    if: fromJSON(inputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Without this the suite cannot start: nothing else in the repository
      # installs a browser, and there is no postinstall hook that would.
      #
      # The install is split so each half can be bounded by the user that owns
      # it: `--with-deps` runs apt-get as root through sudo, where a `timeout`
      # run as the runner user cannot signal it and would leave apt holding its
      # lock for the next attempt. So the system dependencies run under
      # `sudo timeout` and the browser download under its own `timeout`; a
      # timed-out attempt is a failed one and the loop continues. Whole-step
      # times from 2026-09-18 to 2026-10-08: at most 49s until 2026-10-05, then
      # a median of 23s but a tail to 836s while the Ubuntu mirrors were
      # degraded on 2026-10-06 to 2026-10-08. Where logs split the phases the
      # tail was all dependencies and the browser download never exceeded 12s.
      # Caps of 8m and 3m keep three attempts near 34 minutes, inside this
      # job's hour.
      - name: Install Playwright browsers
        run: |
          for attempt in 1 2 3; do
            if sudo env "PATH=$PATH" timeout --kill-after=15s 8m node_modules/.bin/playwright install-deps chromium &&
              timeout --kill-after=15s 3m pnpm exec playwright install chromium; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Run shard
        id: run_shard
        env:
          E2E_SPECS: ${{ toJSON(matrix.specs) }}
        run: node scripts/prValidationScope.ts run

      # As in the unit matrix: the failure is already fatal, and this names the
      # shard so twelve logs do not have to be opened to find it.
      - name: Report shard failure
        if: ${{ !cancelled() && steps.run_shard.outcome == 'failure' }}
        env:
          SHARD: ${{ matrix.id }}
        run: |
          printf '::warning title=End-to-end shard failed::Shard %s failed; inspect the Run shard log.\n' "$SHARD"
          printf '### End-to-end shard %s failed\n\n' "$SHARD" >> "$GITHUB_STEP_SUMMARY"
          printf 'Inspect the `Run shard` step log for raw failure output.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-blob-${{ matrix.id }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: error

  e2e-report:
    name: End-to-end report
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one report
        run: pnpm exec playwright merge-reports --reporter=html all-blob-reports

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error

  browser-ai-webgpu:
    name: Browser AI WebGPU admission
    # The default Chromium matrix must prove the unsupported boundary on hosts
    # without hardware WebGPU. This focused leg owns the complementary positive
    # proof and therefore fails, rather than skips, when macOS cannot provide a
    # core non-fallback adapter.
    if: inputs.browser-ai
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bounded like the retried install above: a stalled download fails in
      # minutes rather than holding the job to its limit. Healthy installs on
      # this runner take under 25s.
      - name: Install Chromium
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      - name: Run Browser AI WebGPU admission
        run: pnpm test:e2e:browser-ai-webgpu-admission

  heavy-gate:
    name: HeavyGate
    if: ${{ always() }}
    needs:
      - e2e
      - e2e-report
      - browser-ai-webgpu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected browser jobs to succeed
        if: ${{ always() }}
        env:
          RESULTS: ${{ toJSON(needs) }}
          MATRIX: ${{ inputs.matrix }}
          BROWSER_AI: ${{ inputs.browser-ai }}
        run: |
          set -euo pipefail
          selected=$(printf '%s' "$MATRIX" | jq -er '
            if type != "object" or (.include | type) != "array" then error("invalid E2E plan")
            elif all(.include[]; (.id | type) == "number" and (.specs | type) == "array" and (.specs | length) > 0) then
              if (.include | length) > 0 then "success" else "skipped" end
            else error("invalid E2E group") end')
          case "$BROWSER_AI" in
            true) hardware=success ;;
            false) hardware=skipped ;;
            *) printf 'missing Browser AI scope\n' >&2; exit 1 ;;
          esac
          printf '%s' "$RESULTS" | jq -e --arg selected "$selected" --arg hardware "$hardware" '
            (keys | sort) == ["browser-ai-webgpu", "e2e", "e2e-report"] and
            .e2e.result == $selected and .["e2e-report"].result == $selected and
            .["browser-ai-webgpu"].result == $hardware'
