name: Heavy gates

# Required affected browser checks, called once from health-gates.yml after the
# reviewer App's approval admits the head. The full scheduled train is nightly.yml.
on:
  workflow_call:
    inputs:
      matrix:
        description: Validated explicit E2E file groups; an empty include list selects none.
        required: true
        type: string
      browser-ai:
        description: Whether affected dependencies require hardware WebGPU proof.
        required: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: 24.19.0

jobs:
  e2e:
    name: Affected end-to-end ${{ matrix.id }}
    if: fromJSON(inputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The immutable image contains browsers and their OS libraries. Verify the
      # resolved package can launch them without per-job apt or binary downloads.
      - name: Verify preinstalled browser runtime
        timeout-minutes: 2
        run: node scripts/verifyPlaywrightRuntime.ts 1.64.1

      - name: Run shard
        id: run_shard
        env:
          E2E_SPECS: ${{ toJSON(matrix.specs) }}
        run: node scripts/prValidationScope.ts run

      # As in the unit matrix: the failure is already fatal, and this names the
      # shard so twelve logs do not have to be opened to find it.
      - name: Report shard failure
        if: ${{ !cancelled() && steps.run_shard.outcome == 'failure' }}
        env:
          SHARD: ${{ matrix.id }}
        run: |
          printf '::warning title=End-to-end shard failed::Shard %s failed; inspect the Run shard log.\n' "$SHARD"
          printf '### End-to-end shard %s failed\n\n' "$SHARD" >> "$GITHUB_STEP_SUMMARY"
          printf 'Inspect the `Run shard` step log for raw failure output.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-blob-${{ matrix.id }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: error

  e2e-report:
    name: End-to-end report
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one report
        run: pnpm exec playwright merge-reports --reporter=html all-blob-reports

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error

  browser-ai-webgpu:
    name: Browser AI WebGPU admission
    # The default Chromium matrix must prove the unsupported boundary on hosts
    # without hardware WebGPU. This focused leg owns the complementary positive
    # proof and therefore fails, rather than skips, when macOS cannot provide a
    # core non-fallback adapter.
    if: inputs.browser-ai
    runs-on: macos-14
    # Every step carries its own cap, and the caps leave the job two minutes of
    # runner overhead. Checkout took 44s at most in 88 successful admissions
    # from 2026-10-11 to 2026-10-21, but a slow merge-ref fetch hit a 1-minute
    # cap at 38% of the tree update (run 39588034702), so it has three. Set up
    # pnpm's self-installer reads the npm registry, and during the registry
    # slowdown of 2026-10-22 02:18-03:21Z that step took about 5 minutes on
    # macOS (304s in job 119609756189) while admissions died at a 1-minute
    # cap (run 39703602835), so it has seven. Set up Node, which fetches Node
    # and restores the pnpm store, has taken over 40% of a 1-minute cap, so it
    # has three.
    timeout-minutes: 40
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        timeout-minutes: 1
        run: corepack enable

      - name: Set up pnpm
        timeout-minutes: 7
        uses: ./.github/actions/setup-pnpm
        with:
          package_json_file: package.json

      - name: Set up Node
        timeout-minutes: 3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 2
        run: pnpm install --frozen-lockfile

      # Bounded like the retried install above: a stalled download fails in
      # minutes rather than holding the job to its limit. Installs on this
      # runner took 24s at the 99th percentile and 103s at most from
      # 2026-09-20 to 2026-10-08.
      - name: Install Chromium
        timeout-minutes: 2
        run: pnpm exec playwright install chromium

      - name: Run Browser AI WebGPU admission
        timeout-minutes: 18
        shell: bash
        env:
          DEBUG: pw:api,pw:browser
        run: |
          set -o pipefail
          log=browser-ai-webgpu-admission.log
          printf '[browser-ai-webgpu] started %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee "$log"
          set +e
          pnpm test:e2e:browser-ai-webgpu-admission 2>&1 | tee -a "$log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '[browser-ai-webgpu] completed %s command=%s log=%s\n' \
            "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "${statuses[0]}" "${statuses[1]}" | tee -a "$log"
          if [ "${statuses[0]}" -ne 0 ]; then
            exit "${statuses[0]}"
          fi
          exit "${statuses[1]}"

      - name: Upload Browser AI WebGPU diagnostics
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-ai-webgpu-diagnostics
          path: |
            browser-ai-webgpu-admission.log
            test-results/**/trace.zip
            test-results/**/error-context.md
            test-results/.last-run.json
          retention-days: 7
          if-no-files-found: warn

  heavy-gate:
    name: HeavyGate
    if: ${{ always() }}
    needs:
      - e2e
      - e2e-report
      - browser-ai-webgpu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected browser jobs to succeed
        if: ${{ always() }}
        env:
          RESULTS: ${{ toJSON(needs) }}
          MATRIX: ${{ inputs.matrix }}
          BROWSER_AI: ${{ inputs.browser-ai }}
        run: |
          set -euo pipefail
          selected=$(printf '%s' "$MATRIX" | jq -er '
            if type != "object" or (.include | type) != "array" then error("invalid E2E plan")
            elif all(.include[]; (.id | type) == "number" and (.specs | type) == "array" and (.specs | length) > 0) then
              if (.include | length) > 0 then "success" else "skipped" end
            else error("invalid E2E group") end')
          case "$BROWSER_AI" in
            true) hardware=success ;;
            false) hardware=skipped ;;
            *) printf 'missing Browser AI scope\n' >&2; exit 1 ;;
          esac
          printf '%s' "$RESULTS" | jq -e --arg selected "$selected" --arg hardware "$hardware" '
            (keys | sort) == ["browser-ai-webgpu", "e2e", "e2e-report"] and
            .e2e.result == $selected and .["e2e-report"].result == $selected and
            .["browser-ai-webgpu"].result == $hardware'
