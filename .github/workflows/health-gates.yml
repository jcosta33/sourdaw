name: Health gates

# This workflow exists so that nobody has to run these checks on their own
# machine. Several agents working in parallel lanes cannot each run a repository
# -wide typecheck, lint, or test suite without exhausting the machine they share
# and stalling one another. Everything that costs real resources belongs here or
# in `heavy-gates.yml`.
#
# It has exactly one trigger, and that is load-bearing rather than incidental.
# `Gate` is a required status check on `main`, and GitHub counts a check run
# whose conclusion is `skipped` as satisfying a required check while preferring
# the most recent run of that name. So any event that can reach this file and
# legitimately skip `gate` can mint a passing `Gate` over a red head. A
# `pull_request_review` trigger did exactly that: a comment-only review skipped
# every job, minted `Gate` as `skipped`, and flipped the required check to
# satisfied on a head whose earlier `Gate` had failed. The fix is structural
# rather than conditional — the review, schedule and dispatch events live in
# `heavy-gates.yml`, which mints `HeavyGate` and never `Gate`. Do not add a
# trigger here, and do not name a job in `heavy-gates.yml` `Gate`.
#
# The validation legs themselves live in `validation.yml`, called from here and
# from the heavy workflow so there is one definition of them rather than two.
#
# `gate` is the stable summary and the required check. It depends on the
# validation call, whose aggregate result is a failure when any leg inside it
# failed and a success when each either succeeded or was legitimately skipped.
# `codeql`, `secrets`, the end-to-end matrix and the Browser AI hardware proof
# are deliberately not here: they are heavy-lane jobs that never ran on a
# pull-request push, so every `Gate` that listed them listed jobs that were
# always `skipped`. Their enforcement lives in `heavy-gates.yml` and, when it is
# armed, in `deliver`'s required-CI admission. A required check from a workflow
# skipped by trigger-level path, branch, or commit-message filters remains
# pending; `gate` only makes conditional job skips resolve. Do not rename
# `gate`.
#
# Runners are standard GitHub-hosted labels only. Public repositories bill
# nothing for those; larger and GPU runners bill even here.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # One in-flight validation per pull request; a newer push cancels the older
  # run because its answer is about a head nobody will merge.
  group: health-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation
    uses: ./.github/workflows/validation.yml

  gate:
    # Named distinctly from the workflow so the stable summary is unambiguous in
    # the checks list. Renaming it breaks the ruleset that requires it.
    name: Gate
    # `!cancelled()` is the whole condition, and it has to stay that way. Any
    # predicate that can be false here lets this job skip, and a skipped `Gate`
    # reads to GitHub as a passing required check. This workflow answers only to
    # `pull_request`, so there is no event for such a predicate to discriminate
    # on anyway.
    if: ${{ !cancelled() }}
    needs:
      - validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded or been skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS"
          failed=$(printf '%s' "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            printf 'failing jobs:\n%s\n' "$failed"
            exit 1
          fi
          printf 'every job succeeded or was skipped\n'
