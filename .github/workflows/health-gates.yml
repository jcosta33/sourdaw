name: Health gates

# Runs on manual dispatch only.
#
# Automatic triggers were removed because the account's Actions billing is
# suspended: every run fails within seconds with "The job was not started
# because recent account payments have failed or your spending limit needs to
# be increased", producing a red check on every pull request that says nothing
# about the code. A gate that always fails is worse than no gate — it trains
# everyone to ignore it.
#
# The job definitions are kept rather than deleted, because they are the
# record of what the gates actually run. To restore automatic CI once billing
# is resolved, put back:
#
#   on:
#     pull_request:
#     push:
#       branches:
#         - main
#
# Until then the same checks run locally, and the equivalents are:
#
#   pnpm test:health-gates
#   pnpm health:web:full
#   pnpm health:server:full
#
# `health-gates-server.sh` covers the collaboration server build *and* the Rust
# workspace (clippy --all-targets, then cargo test in debug). It is one script
# on purpose: the local run and the CI run execute the same commands, so they
# cannot drift.
#
# Note that a local run cannot catch a file that exists on disk but was never
# committed. Verifying a merge target from a clean checkout — a fresh worktree
# installed off the lockfile — is the substitute for that, and it is the one
# thing local gates genuinely miss.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web app health gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test health gate infrastructure
        run: pnpm test:health-gates

      - name: Web health gates
        run: pnpm health:web:full

  server:
    name: Collaboration server and Rust workspace health gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Enable Corepack
        run: corepack enable

      # daw-engine depends on cpal, whose Linux backend builds against ALSA.
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # No version is pinned here on purpose: `rustup show` reads
      # rust-toolchain.toml, so the toolchain cannot drift from what a local
      # run uses.
      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # Builds the collaboration server and runs the Rust workspace gate
      # (clippy --all-targets, then cargo test in debug). One script so the
      # local run and the CI run cannot drift.
      - name: Server and Rust workspace health gates
        run: pnpm health:server:full

  # E2E gate. Inert while this workflow is `workflow_dispatch`-only (Actions
  # billing is suspended — see the header comment). To activate, restore the
  # pull_request / push triggers named there; this job then runs the full
  # Playwright suite via the playwright.config.ts `webServer` (auto-starts Vite
  # on :5173), --workers=1 for determinism, and fails the build on any red spec.
  # The suite must be deterministic and green before this gates merges — gating
  # a flaky or red suite trains everyone to ignore it.
  e2e:
    name: End-to-end health gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Playwright E2E suite
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
