name: Health gates

# Only pull_request may mint Gate. GitHub accepts skipped required checks, so
# review, label, schedule and dispatch events must never create another Gate.
# Every non-draft head runs its selected checks without a label or review prerequisite.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

# One run per pull request: a newer head event supersedes an older run. The
# cancelled run's gate still runs under always() and fails, and the newest run
# ends in its own non-skipped Gate for a non-draft PR. Drafts run no checks.
concurrency:
  group: health-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    if: ${{ !github.event.pull_request.draft }}
    name: Plan required checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      matrix: ${{ steps.plan.outputs.matrix }}
      browser: ${{ steps.plan.outputs.browser }}
      browser-ai: ${{ steps.plan.outputs.browser-ai }}
      codeql: ${{ steps.plan.outputs.codeql }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Plan affected checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/prValidationScope.ts plan
      - name: Upload scope manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-validation-scope
          path: pr-validation-scope.json
          if-no-files-found: error
          retention-days: 7

  validation:
    name: Validation
    needs: scope
    uses: ./.github/workflows/validation.yml
    with:
      browser: ${{ needs.scope.outputs.browser == 'true' }}
      profile: ${{ needs.scope.outputs.profile }}

  affected:
    name: Affected workflows
    # Run browser and hardware checks only after the faster required validation succeeds.
    needs: [scope, validation]
    uses: ./.github/workflows/heavy-gates.yml
    with:
      matrix: ${{ needs.scope.outputs.matrix }}
      browser-ai: ${{ needs.scope.outputs.browser-ai == 'true' }}

  codeql:
    name: CodeQL
    needs: scope
    if: needs.scope.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3

  gate:
    name: Gate
    if: ${{ always() && !github.event.pull_request.draft }}
    needs:
      - scope
      - validation
      - affected
      - codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected checks to succeed
        if: ${{ always() }}
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$RESULTS" | jq -e '
            (keys | sort) == ["affected", "codeql", "scope", "validation"] and
            .scope.result == "success" and .validation.result == "success" and .affected.result == "success" and
            (.scope.outputs.browser == "true" or .scope.outputs.browser == "false") and
            (.scope.outputs["browser-ai"] == "true" or .scope.outputs["browser-ai"] == "false") and
            (if .scope.outputs.codeql == "true" then .codeql.result == "success"
             elif .scope.outputs.codeql == "false" then .codeql.result == "skipped"
             else false end)'
