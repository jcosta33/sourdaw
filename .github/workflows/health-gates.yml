name: Health gates

# Runs on manual dispatch only.
#
# Automatic triggers were removed because the account's Actions billing is
# suspended: every run fails within seconds with "The job was not started
# because recent account payments have failed or your spending limit needs to
# be increased", producing a red check on every pull request that says nothing
# about the code. A gate that always fails is worse than no gate — it trains
# everyone to ignore it.
#
# The job definitions are kept rather than deleted, because they are the
# record of what the gates actually run. To restore automatic CI once billing
# is resolved, put back:
#
#   on:
#     pull_request:
#     push:
#       branches:
#         - main
#
# Until then the same checks run locally, and the equivalents are:
#
#   pnpm test:health-gates
#   ./scripts/health-gates-web.sh
#   ./scripts/health-gates-server.sh
#
# Note that a local run cannot catch a file that exists on disk but was never
# committed. Verifying a merge target from a clean checkout — a fresh worktree
# installed off the lockfile — is the substitute for that, and it is the one
# thing local gates genuinely miss.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web app health gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test health gate infrastructure
        run: pnpm test:health-gates

      - name: Web health gates
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: ./scripts/health-gates-web.sh

  server:
    name: Collaboration server health gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build server
        run: ./scripts/health-gates-server.sh
