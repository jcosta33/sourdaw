name: Health gates

# Only pull_request may mint Gate. GitHub accepts skipped required checks, so
# approval, schedule and dispatch must never create another Gate on this head.
# Every selected check finishes before this required aggregate can succeed.
# Pushes run only the cheap pr-checks.yml; this heavy run starts when a label is
# added, and admission lets it proceed only for the reviewer App's approval
# label on its approval of this exact head. Any other label event still ends
# in a failing Gate that names the reason, never a skipped one.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: health-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admission:
    name: Approval admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      admitted: ${{ steps.decide.outputs.admitted }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      # The decision runs from the default branch, never the candidate head,
      # so a pull request cannot rewrite the rule that admits it.
      - name: Checkout trusted admission
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          sparse-checkout: scripts
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Read reviews
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --paginate --slurp "repos/$REPOSITORY/pulls/$NUMBER/reviews" > "$RUNNER_TEMP/reviews.json"
      - name: Decide admission
        id: decide
        env:
          REVIEWS_PATH: ${{ runner.temp }}/reviews.json
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABEL_NAME: ${{ github.event.label.name }}
          SENDER_NODE_ID: ${{ github.event.sender.node_id }}
        run: node trusted/scripts/ciApprovalAdmission.ts

  scope:
    name: Plan required checks
    needs: admission
    if: needs.admission.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      matrix: ${{ steps.plan.outputs.matrix }}
      browser: ${{ steps.plan.outputs.browser }}
      browser-ai: ${{ steps.plan.outputs.browser-ai }}
      codeql: ${{ steps.plan.outputs.codeql }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Plan affected checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/prValidationScope.ts plan
      - name: Upload scope manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-validation-scope
          path: pr-validation-scope.json
          if-no-files-found: error
          retention-days: 7

  selection-shadow:
    name: E2E selection shadow
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable integration commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: shadow-integration
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable shadow control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: shadow-control
          fetch-depth: 0
          persist-credentials: false
      - name: Download authoritative scope
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-validation-scope
          path: shadow-scope
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: shadow-control/package.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: shadow-control/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: shadow-control
        run: pnpm install --frozen-lockfile
      - name: Measure shadow selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INTEGRATION_SHA: ${{ github.sha }}
          INTEGRATION_ROOT: shadow-integration
          CONTROL_ROOT: shadow-control
        run: node shadow-control/scripts/e2eSelectionShadow.ts shadow-scope/pr-validation-scope.json
      - name: Upload shadow measurement
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-selection-shadow
          path: e2e-selection-shadow.json
          if-no-files-found: error
          retention-days: 7

  validation:
    name: Validation
    needs: scope
    uses: ./.github/workflows/validation.yml
    with:
      browser: ${{ needs.scope.outputs.browser == 'true' }}
      profile: ${{ needs.scope.outputs.profile }}

  affected:
    name: Affected workflows
    # Run browser and hardware checks only after the faster required validation succeeds.
    needs: [scope, validation]
    uses: ./.github/workflows/heavy-gates.yml
    with:
      matrix: ${{ needs.scope.outputs.matrix }}
      browser-ai: ${{ needs.scope.outputs.browser-ai == 'true' }}

  codeql:
    name: CodeQL
    needs: scope
    if: needs.scope.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3

  gate:
    name: Gate
    if: ${{ always() }}
    needs:
      - admission
      - scope
      - validation
      - affected
      - codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected checks to succeed
        if: ${{ always() }}
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$RESULTS" | jq -r '
            if .admission.result == "success" and .admission.outputs.admitted == "true" then empty
            else "::error title=Gate not admitted::\(.admission.outputs.reason // "approval admission did not decide")" end'
          printf '%s' "$RESULTS" | jq -e '
            (keys | sort) == ["admission", "affected", "codeql", "scope", "validation"] and
            .admission.result == "success" and .admission.outputs.admitted == "true" and
            .scope.result == "success" and .validation.result == "success" and .affected.result == "success" and
            (.scope.outputs.browser == "true" or .scope.outputs.browser == "false") and
            (.scope.outputs["browser-ai"] == "true" or .scope.outputs["browser-ai"] == "false") and
            (if .scope.outputs.codeql == "true" then .codeql.result == "success"
             elif .scope.outputs.codeql == "false" then .codeql.result == "skipped"
             else false end)'
