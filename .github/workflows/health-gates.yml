name: Health gates

# Only pull_request may mint Gate. GitHub accepts skipped required checks, so
# approval, schedule and dispatch must never create another Gate on this head.
# Every selected check finishes before this required aggregate can succeed.
# The workflow runs for every open, push, reopen, and draft-state change.
# Heavy checks run only when the pull request is not a draft. A draft still
# ends in a failing Gate, never a skipped one: a skipped required check passes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

# One run per pull request: a newer push or draft-state change supersedes an
# older run. The cancelled run's gate still runs under always() and fails, and
# the newest run always ends in its own non-skipped Gate, so no cancellation
# yields a skip.
concurrency:
  group: health-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Plan required checks
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reading the nightly coverage map artifact needs actions: read.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      matrix: ${{ steps.plan.outputs.matrix }}
      browser: ${{ steps.plan.outputs.browser }}
      browser-ai: ${{ steps.plan.outputs.browser-ai }}
      codeql: ${{ steps.plan.outputs.codeql }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          package_json_file: package.json
      - name: Set up Node
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Only the scheduled or dispatched nightly on main is trusted; any failure
      # writes no map, and the planner then keeps the full browser suite.
      - name: Fetch coverage map
        id: coverage_map
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_COVERAGE_MAP: ${{ runner.temp }}/e2e-coverage-map.json
        run: node scripts/fetchE2eCoverageMap.ts
      - name: Plan affected checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          E2E_COVERAGE_MAP: ${{ runner.temp }}/e2e-coverage-map.json
          E2E_COVERAGE_MAP_CREATED_AT: ${{ steps.coverage_map.outputs.created-at }}
        run: node scripts/prValidationScope.ts plan
      - name: Upload scope manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-validation-scope
          path: pr-validation-scope.json
          if-no-files-found: error
          retention-days: 7

  validation:
    name: Validation
    needs: scope
    uses: ./.github/workflows/validation.yml
    with:
      browser: ${{ needs.scope.outputs.browser == 'true' }}
      profile: ${{ needs.scope.outputs.profile }}

  e2e-build:
    name: Shared E2E build
    needs: scope
    if: ${{ github.event.pull_request.draft == false && needs.scope.result == 'success' && fromJSON(needs.scope.outputs.matrix || '{"include":[]}').include[0] != null }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          package_json_file: package.json

      - name: Set up Node
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared E2E app
        run: node scripts/sharedE2eBuild.ts build

      - name: Upload shared E2E build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  affected:
    name: Affected workflows
    # The producer overlaps validation. Admit consumers only after both required predecessors complete.
    needs: [scope, validation, e2e-build]
    if: >-
      ${{ github.event.pull_request.draft == false && !cancelled() && needs.scope.result == 'success' && needs.validation.result == 'success' &&
          ((fromJSON(needs.scope.outputs.matrix || '{"include":[]}').include[0] != null && needs.e2e-build.result == 'success') ||
           (fromJSON(needs.scope.outputs.matrix || '{"include":[]}').include[0] == null && needs.e2e-build.result == 'skipped')) }}
    uses: ./.github/workflows/heavy-gates.yml
    with:
      matrix: ${{ needs.scope.outputs.matrix }}
      browser-ai: ${{ needs.scope.outputs.browser-ai == 'true' }}

  codeql:
    name: CodeQL
    needs: scope
    if: needs.scope.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          # Match the existing nightly main analysis for PR alert comparison.
          category: .github/workflows/nightly.yml:codeql

  gate:
    name: Gate
    if: ${{ always() }}
    needs:
      - scope
      - e2e-build
      - validation
      - affected
      - codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected checks to succeed
        if: ${{ always() }}
        env:
          RESULTS: ${{ toJSON(needs) }}
          MATRIX: ${{ needs.scope.outputs.matrix }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [ "$DRAFT" != "false" ]; then
            printf '%s\n' '::error title=Gate refused::pull request is a draft'
            exit 1
          fi
          selected=$(printf '%s' "$MATRIX" | jq -er '
            if type != "object" or (.include | type) != "array" then error("invalid E2E plan")
            elif all(.include[]; (.id | type) == "number" and (.specs | type) == "array" and (.specs | length) > 0) then
              if (.include | length) > 0 then "success" else "skipped" end
            else error("invalid E2E group") end')
          printf '%s' "$RESULTS" | jq -e --arg selected "$selected" '
            (keys | sort) == ["affected", "codeql", "e2e-build", "scope", "validation"] and
            .scope.result == "success" and .validation.result == "success" and .affected.result == "success" and
            .["e2e-build"].result == $selected and
            (.scope.outputs.browser == "true" or .scope.outputs.browser == "false") and
            (.scope.outputs["browser-ai"] == "true" or .scope.outputs["browser-ai"] == "false") and
            (if .scope.outputs.codeql == "true" then .codeql.result == "success"
             elif .scope.outputs.codeql == "false" then .codeql.result == "skipped"
             else false end)'
