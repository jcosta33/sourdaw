# One-shot diagnostic for the original failed Linux shard.
name: Advisory Linux incident capture
on:
    pull_request:
        types: [synchronize]
permissions:
    contents: read
jobs:
    capture:
        if: >-
            github.event.pull_request.number == 5860 &&
            github.event.before == 'ed2e49cf20a06239e467ce300b9a3a066e9328bc' &&
            github.run_attempt == 1 &&
            github.event.pull_request.head.ref == 'build/pnpm-private-store'
        runs-on: ubuntu-latest
        timeout-minutes: 75
        container:
            image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
            options: --init --ipc=host
        defaults:
            run:
                shell: bash
        steps:
            - name: Checkout diagnostic control
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  path: control
                  persist-credentials: false
            - name: Checkout frozen integration
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: d68a5fb5d2f57e56f2bc9fa9430d25850edaab3d
                  path: source
                  persist-credentials: false
            - name: Set up pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  package_json_file: source/package.json
            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24.19.0
            - name: Verify frozen source
              working-directory: source
              run: |
                  test "$(git rev-parse HEAD)" = d68a5fb5d2f57e56f2bc9fa9430d25850edaab3d
                  test "$(git rev-parse HEAD^{tree})" = bc30ce2f220893808a82f1e966cd789d43f60a63
            - name: Record and verify runtime provenance
              working-directory: source
              env:
                  WORKFLOW_HEAD: ${{ github.event.pull_request.head.sha }}
                  RUN_ID: ${{ github.run_id }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
              run: |
                  test "$(node --version)" = v24.19.0
                  test "$(pnpm --version)" = 11.6.0
                  {
                    printf 'source_head=%s\n' "$(git rev-parse HEAD)"
                    printf 'source_tree=%s\n' "$(git rev-parse HEAD^{tree})"
                    printf 'workflow_head=%s\nrun_id=%s\nrun_attempt=%s\n' "$WORKFLOW_HEAD" "$RUN_ID" "$RUN_ATTEMPT"
                    node --version
                    pnpm --version
                  } | tee ../provenance.txt
            - name: Install dependencies
              working-directory: source
              run: pnpm install --frozen-lockfile
            - name: Verify browser runtime
              working-directory: source
              run: |
                  set -o pipefail
                  node scripts/verifyPlaywrightRuntime.ts 1.63.0 2>&1 | tee -a ../provenance.txt
                  node -e "const p=require('@playwright/test'); console.log('playwright=' + require('@playwright/test/package.json').version); console.log('chromium=' + p.chromium.executablePath())" | tee -a ../provenance.txt
            - name: Prepare private debug files
              run: |
                  mkdir -p "$RUNNER_TEMP/sourdaw-debug"
                  node -e "const b=require('./control/.github/diagnostics/5860/baseline.json'); console.log('E2E_SPECS='+JSON.stringify(b.specs))" >> "$GITHUB_ENV"
                  cp control/.github/diagnostics/5860/baseline.json baseline-provenance.json
                  echo "SOURDAW_DEBUG_DIR=$RUNNER_TEMP/sourdaw-debug" >> "$GITHUB_ENV"
                  echo "NODE_OPTIONS=${NODE_OPTIONS:+$NODE_OPTIONS }--import=$GITHUB_WORKSPACE/control/.github/diagnostics/5860/debug-preload.mjs" >> "$GITHUB_ENV"
            - name: Verify original collection
              working-directory: source
              env:
                  CAPTURE_BASELINE: ../control/.github/diagnostics/5860/baseline.json
                  LIST_RECEIPT: ../collection-list.txt
              run: node ../control/.github/diagnostics/5860/collection-preflight.mjs
            - name: Sample memory before shard
              run: |
                  for file in /proc/self/cgroup /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
                    printf '%s\n' "--- $file"
                    if [ -r "$file" ]; then cat "$file"; else echo unavailable; fi
                  done > memory-before.txt
            - name: Run original shard
              working-directory: source
              env:
                  DEBUG: pw:protocol,pw:api,pw:browser
                  DEBUG_COLORS: '0'
                  MAX_LOG_LENGTH: '1024'
              run: |
                  set -o pipefail
                  node scripts/prValidationScope.ts run 2>&1 | tee shard.log
            - name: Sample memory after shard
              if: ${{ always() }}
              run: |
                  for file in /proc/self/cgroup /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
                    printf '%s\n' "--- $file"
                    if [ -r "$file" ]; then cat "$file"; else echo unavailable; fi
                  done > memory-after.txt
            - name: Verify frozen source after capture
              if: ${{ always() }}
              working-directory: source
              run: |
                  test "$(git rev-parse HEAD)" = d68a5fb5d2f57e56f2bc9fa9430d25850edaab3d
                  test "$(git rev-parse HEAD^{tree})" = bc30ce2f220893808a82f1e966cd789d43f60a63
                  test -z "$(git status --porcelain --untracked-files=no)"
            - name: Retain capture
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: advisory-linux-capture
                  path: |
                      source/shard.log
                      source/blob-report/
                      source/test-results/
                      collection-list.txt
                      provenance.txt
                      baseline-provenance.json
                      memory-before.txt
                      memory-after.txt
                      ${{ runner.temp }}/sourdaw-debug/
                  retention-days: 7
