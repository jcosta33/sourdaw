# One-shot diagnostic for the original failed Linux shard.
name: Advisory Linux incident capture
on:
    pull_request:
        types: [synchronize]
permissions:
    contents: read
jobs:
    capture:
        if: >-
            github.event.pull_request.number == 5860 &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.before == 'bd71bfabe515f4151fbe4b6d9faab62a1520568d' &&
            github.run_attempt == 1 &&
            github.event.pull_request.head.ref == 'build/pnpm-private-store'
        runs-on: ubuntu-latest
        timeout-minutes: 75
        container:
            image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
            options: --init --ipc=host
        defaults:
            run:
                shell: bash
        steps:
            - name: Checkout diagnostic control
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  path: control
                  persist-credentials: false
            - name: Checkout frozen integration
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: afa60d33e745251ab041492132f95f26b15542e6
                  path: source
                  persist-credentials: false
            - name: Set up pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  package_json_file: source/package.json
            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24.19.0
            - name: Verify frozen source
              working-directory: source
              run: |
                  test "$(git rev-parse HEAD)" = afa60d33e745251ab041492132f95f26b15542e6
                  test "$(git rev-parse HEAD^{tree})" = 5a5ba3149e33fa780d769205b1aa3a94b411e228
            - name: Record and verify runtime provenance
              working-directory: source
              env:
                  WORKFLOW_HEAD: ${{ github.event.pull_request.head.sha }}
                  RUN_ID: ${{ github.run_id }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
              run: |
                  test "$(node --version)" = v24.19.0
                  test "$(pnpm --version)" = 11.6.0
                  {
                    printf 'source_head=%s\n' "$(git rev-parse HEAD)"
                    printf 'source_tree=%s\n' "$(git rev-parse HEAD^{tree})"
                    printf 'workflow_head=%s\nrun_id=%s\nrun_attempt=%s\n' "$WORKFLOW_HEAD" "$RUN_ID" "$RUN_ATTEMPT"
                    node --version
                    pnpm --version
                  } | tee ../provenance.txt
            - name: Install dependencies
              working-directory: source
              run: pnpm install --frozen-lockfile
            - name: Verify browser runtime
              working-directory: source
              run: |
                  set -o pipefail
                  node scripts/verifyPlaywrightRuntime.ts 1.64.1 2>&1 | tee -a ../provenance.txt
                  node -e "const p=require('@playwright/test'); console.log('playwright=' + require('@playwright/test/package.json').version); console.log('chromium=' + p.chromium.executablePath())" | tee -a ../provenance.txt
            - name: Prepare shard selection
              run: |
                  node -e "const b=require('./control/.github/diagnostics/5860/baseline.json'); console.log('E2E_SPECS='+JSON.stringify(b.specs))" >> "$GITHUB_ENV"
                  cp control/.github/diagnostics/5860/baseline.json baseline-provenance.json
            - name: Verify original collection
              working-directory: source
              env:
                  CAPTURE_BASELINE: ../control/.github/diagnostics/5860/baseline.json
                  LIST_RECEIPT: ../collection-list.txt
              run: |
                  unset DEBUG DEBUG_FILE MAX_LOG_LENGTH NODE_OPTIONS
                  node ../control/.github/diagnostics/5860/collection-preflight.mjs
            - name: Sample memory before shard
              run: |
                  for file in /proc/self/cgroup /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
                    printf '%s\n' "--- $file"
                    if [ -r "$file" ]; then cat "$file"; else echo unavailable; fi
                  done > memory-before.txt
            - name: Run original shard
              working-directory: source
              run: |
                  set -o pipefail
                  unset DEBUG DEBUG_FILE MAX_LOG_LENGTH NODE_OPTIONS DIAGNOSTIC_CANARY_SCOPE_ROOT
                  export DIAGNOSTIC_SOURCE_ROOT="$(pwd -P)"
                  export CONTROL_OBSERVER_DIR="$GITHUB_WORKSPACE/observer"
                  mkdir -p "$CONTROL_OBSERVER_DIR"
                  printf '%s  %s\n' b510bcc64d0dd0b27d3036cc981b5b5d274f8abbefe86d75d605b288c0d8e1d9 "$GITHUB_WORKSPACE/control/.github/diagnostics/5860/observer.cjs" | sha256sum -c -
                  export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/control/.github/diagnostics/5860/observer.cjs"
                  set +e
                  node scripts/prValidationScope.ts run 2>&1 | tee shard.log
                  results=("${PIPESTATUS[@]}")
                  set -e
                  unset NODE_OPTIONS
                  test "${results[1]}" -eq 0
                  node "$GITHUB_WORKSPACE/control/.github/diagnostics/5860/verify-observation.cjs" "$DIAGNOSTIC_SOURCE_ROOT" "$CONTROL_OBSERVER_DIR"
                  exit "${results[0]}"
            - name: Sample memory after shard
              if: ${{ always() }}
              run: |
                  for file in /proc/self/cgroup /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
                    printf '%s\n' "--- $file"
                    if [ -r "$file" ]; then cat "$file"; else echo unavailable; fi
                  done > memory-after.txt
            - name: Verify frozen source after capture
              if: ${{ always() }}
              working-directory: source
              run: |
                  test "$(git rev-parse HEAD)" = afa60d33e745251ab041492132f95f26b15542e6
                  test "$(git rev-parse HEAD^{tree})" = 5a5ba3149e33fa780d769205b1aa3a94b411e228
                  test -z "$(git status --porcelain --untracked-files=no)"
            - name: Retain capture
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: advisory-linux-capture
                  path: |
                      source/shard.log
                      source/blob-report/
                      source/test-results/
                      collection-list.txt
                      provenance.txt
                      baseline-provenance.json
                      memory-before.txt
                      memory-after.txt
                      observer/
                  retention-days: 7
