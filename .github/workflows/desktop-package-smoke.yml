name: Desktop package smoke

# Exercise directly consumed packages on native runners. The required Gate and
# the production deploy have their own entry points.
on:
  pull_request:
    paths:
      - .cargo/**
      - .github/workflows/desktop-package-smoke.yml
      - .github/actions/setup-pnpm/**
      - build/**
      - crates/**
      - Cargo.lock
      - Cargo.toml
      - electron/**
      - electron-builder.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - public/legal/**
      - public/samples/**
      - rust-toolchain.toml
      - scripts/buildElectronPreload.ts
      - scripts/buildNativeAddon.ts
      - scripts/desktopLatencyDiagnostics.ts
      - scripts/desktopLatencyLaunch.ts
      - scripts/electronRuntimeContract.ts
      - scripts/flipElectronFuses.ts
      - scripts/installHarnessPlugin.ts
      - scripts/packagedAppSession.ts
      - scripts/smokeDesktopPackage.ts
      - scripts/verifyPackagedNativeArtifacts.ts
      - vite.config.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: Desktop packages (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: macOS ARM64
            format: dmg
          - runner: windows-2025
            label: Windows x64
            format: nsis
          - runner: ubuntu-22.04
            label: Linux x64
            format: appimage
    env:
      SOURDAW_PACKAGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout the package source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURDAW_PACKAGE_HEAD }}
          persist-credentials: false

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Install Linux audio and display prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev xvfb xauth

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the real CLAP fixture
        run: pnpm harness:plugin:install

      - name: Build the desktop packages
        id: build-packages
        env:
          # electron-builder skips macOS signing on PRs unless allowed. The configured
          # ad-hoc identity seals the fuse changes without distribution credentials.
          CSC_FOR_PULL_REQUEST: ${{ runner.os == 'macOS' && 'true' || 'false' }}
        run: pnpm desktop:build

      - name: Launch the macOS DMG or installed Windows package and scan the fixture
        if: runner.os != 'Linux'
        env:
          PACKAGE_FORMAT: ${{ matrix.format }}
        shell: bash
        run: node scripts/smokeDesktopPackage.ts "$PACKAGE_FORMAT" "$RUNNER_TEMP/desktop-package-smoke"

      - name: Launch the extracted macOS ZIP and scan the fixture
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.build-packages.outcome == 'success' }}
        run: node scripts/smokeDesktopPackage.ts zip "$RUNNER_TEMP/desktop-package-smoke"

      - name: Launch the AppImage payload under Xvfb and scan the fixture
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/smokeDesktopPackage.ts appimage "$RUNNER_TEMP/desktop-package-smoke"

      - name: Upload package smoke receipts
        if: ${{ !cancelled() && steps.build-packages.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-package-smoke-${{ matrix.format }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-package-smoke/*.json
          retention-days: 7
          if-no-files-found: error
