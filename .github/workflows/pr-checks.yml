name: PR checks

# Cheap validation for every push, before review. It mints no Gate and is not
# required: the required Gate, the affected browser matrix, Browser AI hardware
# admission and CodeQL run in health-gates.yml once the reviewer App approves
# the exact head, so pushes from many lanes no longer queue the heavy suite.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Plan push checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reading the nightly coverage map artifact needs actions: read.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      matrix: ${{ steps.plan.outputs.matrix }}
      browser: ${{ steps.plan.outputs.browser }}
      browser-ai: ${{ steps.plan.outputs.browser-ai }}
      codeql: ${{ steps.plan.outputs.codeql }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          package_json_file: package.json
      - name: Set up Node
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Only the scheduled or dispatched nightly on main is trusted; any failure
      # writes no map, and the planner then keeps the full browser suite.
      - name: Fetch coverage map
        id: coverage_map
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_COVERAGE_MAP: ${{ runner.temp }}/e2e-coverage-map.json
        run: node scripts/fetchE2eCoverageMap.ts
      - name: Plan affected checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          E2E_COVERAGE_MAP: ${{ runner.temp }}/e2e-coverage-map.json
          E2E_COVERAGE_MAP_CREATED_AT: ${{ steps.coverage_map.outputs.created-at }}
        run: node scripts/prValidationScope.ts plan
      - name: Upload scope manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-validation-scope
          path: pr-validation-scope.json
          if-no-files-found: error
          retention-days: 7

  validation:
    name: Push validation
    needs: scope
    uses: ./.github/workflows/validation.yml
    with:
      mode: preliminary
      browser: ${{ needs.scope.outputs.browser == 'true' }}
      profile: ${{ needs.scope.outputs.profile }}
