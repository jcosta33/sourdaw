name: Validation

# Required validation called only by health-gates.yml. Browser smoke uses the
# same deterministic affected plan as the browser matrix. Nightly owns full-load validation.

on:
  workflow_call:
    inputs:
      browser:
        description: Whether the affected plan requires browser smoke.
        required: true
        type: boolean
      profile:
        description: Affected paths are documentation, known review tooling, or broad.
        required: false
        default: broad
        type: string
    outputs:
      heavy:
        description: Whether the caller's event admits the heavy lane.
        value: ${{ jobs.decide.outputs.heavy }}
      rust:
        description: Whether the head touches Rust or the collaboration server.
        value: ${{ jobs.decide.outputs.rust }}
      server:
        description: Whether the head touches the collaboration server.
        value: ${{ jobs.decide.outputs.server }}
      e2e:
        description: Whether the head touches the browser surface.
        value: ${{ jobs.decide.outputs.e2e }}
      web:
        description: Whether the head touches the web application.
        value: ${{ jobs.decide.outputs.web }}
      code:
        description: Whether the head carries anything but prose.
        value: ${{ jobs.decide.outputs.code }}
      tooling:
        description: Whether known review tooling requires the script unit suite.
        value: ${{ jobs.decide.outputs.tooling }}

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: 24.19.0

jobs:
  decide:
    name: Decide scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
      rust: ${{ steps.scope.outputs.rust }}
      server: ${{ steps.scope.outputs.server }}
      e2e: ${{ steps.scope.outputs.e2e }}
      web: ${{ steps.scope.outputs.web }}
      code: ${{ steps.scope.outputs.code }}
      tooling: ${{ steps.scope.outputs.tooling }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter changed paths
        id: filter
        # A transient GitHub API failure while listing the changed files must
        # not fail the job; the retry step below re-runs this filter, and
        # `Resolve scope` fails the job when neither attempt produced verdicts.
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Negated patterns only subtract under this quantifier. The default
          # `some` would let `**` alone satisfy `unclassified`, which would then
          # match every change and force the full lane on documentation too.
          predicate-quantifier: some-with-excludes
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'scripts/health-gates-server.sh'
              - 'scripts/health-gates-rust.sh'
            server:
              - 'server/**'
              - 'scripts/health-gates-server.sh'
              - 'package.json'
              - 'vite.config.ts'
              - 'scripts/checkVitestCollectionScope.ts'
              - '.github/workflows/health-gates.yml'
              - '.github/workflows/nightly.yml'
            e2e:
              - 'src/**'
              - 'public/**'
              - 'tests/e2e/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
            web:
              - 'src/**'
              - 'public/**'
              - 'electron/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'
              - 'tsconfig*.json'
            # Everything the scopes above do not claim, minus the two places
            # that hold nothing but prose. Repository metadata is machine-read,
            # not documentation: issue templates, the pull-request template and
            # workflow definitions all land here and force the fast lane that
            # polices them. A path nobody has classified lands here too, which
            # is the point — an unknown path costs a full lane rather than
            # silently skipping the checks that would have observed it.
            unclassified:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!crates/**'
              - '!Cargo.toml'
              - '!Cargo.lock'
              - '!rust-toolchain.toml'
              - '!server/**'
              - '!src/**'
              - '!public/**'
              - '!electron/**'
              - '!scripts/**'
              - '!tests/e2e/**'
              - '!package.json'
              - '!pnpm-lock.yaml'
              - '!vite.config.ts'
              - '!playwright.config.ts'
              - '!tsconfig*.json'

      # On a pull request's shallow checkout the filter lists the changed files
      # through the GitHub REST API, which intermittently answers 500; that one
      # transient answer used to fail the whole job and block Gate (#3592). The
      # retry re-runs the identical filter, and `Resolve scope` fails loudly
      # when neither attempt produced verdicts, so a persistent failure cannot
      # read as an all-false scope that silently skips every lane.
      - name: Retry changed-paths filter after a transient API failure
        id: filter-retry
        # An explicit `if` fully replaces the implicit `success()`, so this
        # runs despite the first attempt's failure.
        if: steps.filter.outcome == 'failure'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Must stay identical to the `Filter changed paths` step's `with:`
          # block above: a retry that filtered differently would resolve the
          # scope from rules no pin reads.
          predicate-quantifier: some-with-excludes
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'scripts/health-gates-server.sh'
              - 'scripts/health-gates-rust.sh'
            server:
              - 'server/**'
              - 'scripts/health-gates-server.sh'
              - 'package.json'
              - 'vite.config.ts'
              - 'scripts/checkVitestCollectionScope.ts'
              - '.github/workflows/health-gates.yml'
              - '.github/workflows/nightly.yml'
            e2e:
              - 'src/**'
              - 'public/**'
              - 'tests/e2e/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
            web:
              - 'src/**'
              - 'public/**'
              - 'electron/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'
              - 'tsconfig*.json'
            # Everything the scopes above do not claim, minus the two places
            # that hold nothing but prose. Repository metadata is machine-read,
            # not documentation: issue templates, the pull-request template and
            # workflow definitions all land here and force the fast lane that
            # polices them. A path nobody has classified lands here too, which
            # is the point — an unknown path costs a full lane rather than
            # silently skipping the checks that would have observed it.
            unclassified:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!crates/**'
              - '!Cargo.toml'
              - '!Cargo.lock'
              - '!rust-toolchain.toml'
              - '!server/**'
              - '!src/**'
              - '!public/**'
              - '!electron/**'
              - '!scripts/**'
              - '!tests/e2e/**'
              - '!package.json'
              - '!pnpm-lock.yaml'
              - '!vite.config.ts'
              - '!playwright.config.ts'
              - '!tsconfig*.json'

      - name: Resolve scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BROWSER: ${{ inputs.browser }}
          PROFILE: ${{ inputs.profile }}
          # The retry attempt's verdict wins; its empty outputs (it never ran,
          # or it failed too) fall through to the first attempt's, and both
          # being empty leaves the value empty for the guard below to refuse.
          RUST: ${{ steps.filter-retry.outputs.rust || steps.filter.outputs.rust }}
          SERVER: ${{ steps.filter-retry.outputs.server || steps.filter.outputs.server }}
          E2E: ${{ steps.filter-retry.outputs.e2e || steps.filter.outputs.e2e }}
          WEB: ${{ steps.filter-retry.outputs.web || steps.filter.outputs.web }}
          UNCLASSIFIED: ${{ steps.filter-retry.outputs.unclassified || steps.filter.outputs.unclassified }}
        run: |
          set -euo pipefail
          # An empty verdict means both filter attempts failed or never ran;
          # letting it read as `false` would skip every lane under a green job.
          for verdict in "$RUST" "$SERVER" "$E2E" "$WEB" "$UNCLASSIFIED" "$BROWSER"; do
            if [ "$verdict" != "true" ] && [ "$verdict" != "false" ]; then
              printf 'No scope verdict: both "Filter changed paths" and "Retry changed-paths filter after a transient API failure" failed or produced no output.\n' >&2
              exit 1
            fi
          done
          case "$PROFILE" in
            docs|tooling|broad) ;;
            *) printf 'Invalid affected profile: %s\n' "$PROFILE" >&2; exit 1 ;;
          esac
          heavy=false
          if [ "$EVENT" = "pull_request_review" ]; then heavy=true; fi
          rust=$RUST
          server=$SERVER
          e2e=$E2E
          web=$WEB
          if [ "$UNCLASSIFIED" = "true" ]; then
            rust=true
            server=true
            e2e=true
            web=true
          fi
          e2e=$BROWSER
          tooling=false
          if [ "$EVENT" = "pull_request" ]; then
            case "$PROFILE" in
              docs|tooling)
                if [ "$BROWSER" != "false" ]; then
                  printf 'Narrow profile conflicts with browser selection\n' >&2
                  exit 1
                fi
                rust=false
                server=false
                e2e=false
                web=false
                if [ "$PROFILE" = "tooling" ]; then tooling=true; fi
                ;;
            esac
          fi
          # `code` is the one question the scope-independent jobs ask: does this
          # head carry anything but prose? Only a change that claims no scope at
          # all — documentation — answers no.
          code=false
          if [ "$rust" = "true" ] || [ "$server" = "true" ] || [ "$e2e" = "true" ] || [ "$web" = "true" ]; then
            code=true
          fi
          if [ "$tooling" = "true" ]; then code=true; fi
          {
            printf 'heavy=%s\n' "$heavy"
            printf 'rust=%s\n' "$rust"
            printf 'server=%s\n' "$server"
            printf 'e2e=%s\n' "$e2e"
            printf 'web=%s\n' "$web"
            printf 'code=%s\n' "$code"
            printf 'tooling=%s\n' "$tooling"
          } >> "$GITHUB_OUTPUT"

  # The fast lane is three concurrent jobs rather than one serial one. Measured
  # on this workflow's first runs, a single job took 7m21s, of which lint was
  # 3m24s, `deps:validate` 1m28s and the format check 1m02s. Fanning those out
  # puts the wall clock at the slowest one instead of their sum, and a reviewer
  # sees which class failed from the check name without opening a log.

  static:
    name: Types and contracts
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `test:release-inventory` proves each generated Levain manifest
          # against the commit its provenance record pins, by `git show`-ing
          # that blob. A shallow clone does not contain those commits, so the
          # check cannot read them and reports every sample as unverifiable.
          # Only this job needs the history; the others stay shallow.
          fetch-depth: 0

      # Provisions the exact pnpm declared in package.json's `packageManager`
      # field, replacing the Corepack shim this setup used to rely on: a
      # truncated registry stream inside that hot-path fetch crashed Node's
      # undici and red the job before any check ran (#3851). Must precede
      # `Set up Node` so `cache: pnpm` resolves the store path.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheap and unconditional. `wasm:verify` rebuilds nothing — it compares
      # recorded hashes — and a stale committed artifact is exactly what a path
      # filter would hide.
      - name: Artifact freshness
        run: pnpm wasm:verify

      - name: App types
        if: needs.decide.outputs.tooling != 'true'
        run: pnpm typecheck

      - name: Test types
        if: needs.decide.outputs.tooling != 'true'
        run: pnpm typecheck:test

      - name: Script types
        run: pnpm typecheck:scripts

      - name: End-to-end types
        if: needs.decide.outputs.tooling != 'true'
        run: pnpm typecheck:e2e

      - name: Desktop shell types
        if: needs.decide.outputs.tooling != 'true'
        run: pnpm typecheck:electron

      - name: Format
        run: pnpm exec prettier --check "src/**/*.{ts,tsx}" "scripts/**/*.ts" "electron/**/*.ts"

      - name: Command argument schemas
        if: needs.decide.outputs.tooling != 'true'
        run: pnpm test:command-schema

      - name: Release inventory
        run: pnpm test:release-inventory

      - name: Test collection scope
        if: needs.decide.outputs.tooling != 'true'
        run: pnpm test:collection-scope

      - name: Barrel mock coverage
        if: needs.decide.outputs.tooling != 'true'
        run: pnpm test:barrel-mocks

      # The census walks production sources and is isolated from the unit
      # shards so it never inherits their accumulated jsdom/module load debt.
      - name: Device write boundary census
        if: needs.decide.outputs.tooling != 'true'
        run: pnpm test:run src/modules/Arrangement/stores/__tests__/deviceWriteBoundaryClosure.spec.ts

      # Every case assembles a full release candidate, so the file is isolated
      # from the unit shards rather than paying that cost under their load.
      - name: Release proof
        run: pnpm test:run scripts/__tests__/releaseProof.spec.ts

      # Spawns multiple repository fixtures and subprocesses; isolated from the unit
      # shards to keep worker process memory bounded (#3459).
      - name: Agent delivery scripts
        run: pnpm test:run scripts/__tests__/agentDeliveryScripts.spec.ts

      - name: Health gate infrastructure
        run: pnpm test:health-gates

  lint:
    name: Lint
    needs: decide
    # Nothing here reads prose, so a documentation-only head has no way to fail
    # it. `static` stays unconditional: its release-inventory leg answers to
    # provenance records that a prose change can invalidate.
    if: needs.decide.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Provisions the exact pnpm declared in package.json's `packageManager`
      # field, replacing the Corepack shim this setup used to rely on: a
      # truncated registry stream inside that hot-path fetch crashed Node's
      # undici and red the job before any check ran (#3851). Must precede
      # `Set up Node` so `cache: pnpm` resolves the store path.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        # The longest single check in the fast lane, and the local default runs
        # it on one worker for the resource guard's sake rather than the work's.
        env:
          SOURDAW_LINT_CONCURRENCY: auto
          SOURDAW_LINT_THREADS: '0'
        run: pnpm lint:full

  boundaries:
    name: Module boundaries
    needs: decide
    # The import graph cannot move without a code-bearing path changing.
    if: needs.decide.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Provisions the exact pnpm declared in package.json's `packageManager`
      # field, replacing the Corepack shim this setup used to rely on: a
      # truncated registry stream inside that hot-path fetch crashed Node's
      # undici and red the job before any check ran (#3851). Must precede
      # `Set up Node` so `cache: pnpm` resolves the store path.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the dependency graph
        run: pnpm deps:validate

  unit:
    name: Unit suite ${{ matrix.shard }}/4
    needs: decide
    if: needs.decide.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `checkReleaseInventory.spec.ts` reads each measurement's pinned
          # implementation source through `git show <revision>:<path>`.
          # The unit matrix therefore needs the immutable source history.
          fetch-depth: 0

      # Provisions the exact pnpm declared in package.json's `packageManager`
      # field, replacing the Corepack shim this setup used to rely on: a
      # truncated registry stream inside that hot-path fetch crashed Node's
      # undici and red the job before any check ran (#3851). Must precede
      # `Set up Node` so `cache: pnpm` resolves the store path.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite is dominated by jsdom construction and module loading rather
      # than assertions, so worker count is the lever that matters. The local
      # default of two exists for the agent resource guard, not for CI.
      - name: Run shard
        id: run_shard
        env:
          VITEST_MAX_WORKERS: 4
        run: pnpm run test:run --shard=${{ matrix.shard }}/4

      # The shard failure is already fatal above; this only names which of the
      # four it was, in the annotation list and the run summary, so a reader
      # does not open four logs to find the one that failed. `!cancelled()`
      # replaces the implicit `success()` that a failed shard would otherwise
      # skip this step on.
      - name: Report shard failure
        if: ${{ !cancelled() && steps.run_shard.outcome == 'failure' }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          printf '::warning title=Unit suite shard failed::Shard %s failed; inspect the Run shard log.\n' "$SHARD"
          printf '### Unit suite shard %s failed\n\n' "$SHARD" >> "$GITHUB_STEP_SUMMARY"
          printf 'Inspect the `Run shard` step log for raw failure output.\n' >> "$GITHUB_STEP_SUMMARY"

  tooling-unit:
    name: Review tooling unit suite
    needs: decide
    if: needs.decide.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # These expensive specs run once in static, outside a pooled unit run.
      - name: Run script suite
        run: pnpm test:run scripts --exclude='**/releaseProof.spec.ts' --exclude='**/agentDeliveryScripts.spec.ts'

  smoke:
    name: Offline browser smoke
    needs: decide
    # Every product PR runs the offline startup, save/reopen, playback and undo
    # proof. The affected browser matrix runs separately in heavy-gates.yml.
    if: github.event.pull_request != null && needs.decide.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Provisions the exact pnpm declared in package.json's `packageManager`
      # field, replacing the Corepack shim this setup used to rely on: a
      # truncated registry stream inside that hot-path fetch crashed Node's
      # undici and red the job before any check ran (#3851). Must precede
      # `Set up Node` so `cache: pnpm` resolves the store path.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--with-deps` shells out to apt-get for the browser library set, and a
      # transient mirror outage (apt exiting 100) red this job and Gate on an
      # otherwise-green head (#4085). Three attempts with a 5s then 10s
      # backoff; the last failure still fails the step.
      - name: Install Playwright browsers
        run: |
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      # No retries: a smoke set that needs a second attempt is not the fast
      # deterministic signal this job exists to give.
      - name: Run offline smoke set
        run: pnpm test:e2e tests/e2e/smoke.spec.ts --retries=0

  build:
    name: Production build
    needs: decide
    if: needs.decide.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Provisions the exact pnpm declared in package.json's `packageManager`
      # field, replacing the Corepack shim this setup used to rely on: a
      # truncated registry stream inside that hot-path fetch crashed Node's
      # undici and red the job before any check ran (#3851). Must precede
      # `Set up Node` so `cache: pnpm` resolves the store path.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  rust:
    name: Rust workspace and collaboration server
    needs: decide
    if: needs.decide.outputs.rust == 'true' || needs.decide.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Provisions the exact pnpm declared in package.json's `packageManager`
      # field, replacing the Corepack shim this setup used to rely on: a
      # truncated registry stream inside that hot-path fetch crashed Node's
      # undici and red the job before any check ran (#3851). Must precede
      # `Set up Node` so `cache: pnpm` resolves the store path.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      # daw-engine depends on cpal, whose Linux backend builds against ALSA.
      # apt-get update flakes on transient mirror outages (exit 100), reding
      # this job and Gate on an otherwise-green head (#4085), so the install
      # retries three times with a 15s then 30s backoff; the last failure
      # still fails the step. Package list unchanged: libasound2-dev only.
      - name: Install ALSA development headers
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y libasound2-dev; then
              exit 0
            fi
            printf 'ALSA header install failed (attempt %s/3)\n' "$attempt" >&2
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1

      # No version is pinned here on purpose: `rustup show` reads
      # rust-toolchain.toml, so the toolchain cannot drift from a local run.
      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # One script so the local run and the CI run cannot drift. It keeps the
      # Rust legs in debug on purpose: `assert_no_alloc`'s `disable_release`
      # feature is on by default, so a release build turns every real-time
      # allocation guard into a no-op that passes while proving nothing.
      - name: Server and Rust workspace health gates
        env:
          CARGO_HTTP_MULTIPLEXING: 'false'
        run: pnpm health:server:full

  native-macos:
    name: Native audio backend (macOS)
    needs: decide
    # Every platform Sourdaw releases on carries its own hosted evidence of the
    # audio crates, because what they assert is target-specific: allocator,
    # thread scheduling and device backend all differ per platform, so a defect
    # in one of them is invisible to the Linux leg and would surface in a
    # release instead. Debug profile for the reason the `rust` leg records:
    # `assert_no_alloc`'s `disable_release` feature is on by default, so a
    # release build turns every real-time allocation guard into a no-op that
    # passes while proving nothing.
    #
    # `sourdaw-native` is excluded from the Linux Rust leg because its manifest
    # unconditionally enables whisper-rs's `metal` feature. A macOS runner is
    # the only place it compiles, and public repositories get those free.
    if: needs.decide.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test the audio crates
        run: cargo test --package daw-core --package daw-dsp --package daw-engine --all-features

      - name: Test the native crate
        run: cargo test --package sourdaw-native

  native-windows:
    name: Native audio backend (Windows)
    needs: decide
    # The Windows half of the same platform evidence, in debug profile for the
    # reason `native-macos` records above.
    #
    # The WASAPI backend under crates/daw-engine/src/device/wasapi/ compiles
    # only for the Windows target: elsewhere `cfg(any(windows, test))` reaches
    # its pure policy half and never the windows-crate integration code. A
    # native runner replaces the cross-compilation oracle #2253 asked for, and
    # testing keeps that oracle rather than trading it away: a test build
    # compiles everything a `cargo check` of the same crate compiles, and then
    # runs it too.
    if: needs.decide.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test the audio crates
        run: cargo test --package daw-core --package daw-dsp --package daw-engine --all-features

  native-parity:
    name: Native parity (macOS)
    needs: decide
    # `projectLiveGraphProgrammeParity.spec.ts` is the bit-exact live-vs-export
    # proof for #3068, and it — like the two offline-render legs beside it —
    # loads the napi addon from `crates/sourdaw-native/sourdaw-native.node` and
    # skips observably when that artifact is absent. Nothing else here builds
    # it, so without this job the proof runs on developer machines only. macOS
    # is the one platform the crate compiles on, for the reason `native-macos`
    # records above. A TypeScript producer can break parity exactly as a Rust
    # consumer can, so this leg answers to both scopes rather than to `rust`.
    if: needs.decide.outputs.rust == 'true' || needs.decide.outputs.web == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Provisions the exact pnpm declared in package.json's `packageManager`
      # field, replacing the Corepack shim this setup used to rely on: a
      # truncated registry stream inside that hot-path fetch crashed Node's
      # undici and red the job before any check ran (#3851). Must precede
      # `Set up Node` so `cache: pnpm` resolves the store path.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same builder `desktop:build` runs, so the artifact this leg proves
      # against cannot drift from the one the packaged app loads.
      - name: Build the native addon
        run: node scripts/buildNativeAddon.ts

      # The specs decide between running and skipping on `existsSync` of this
      # exact path, so requiring it here is requiring that the parity legs run.
      # The specs close the other half themselves: an always-run guard proves
      # the probed path sits beside the crate's own Cargo.toml, a second proves
      # the host was constructed exactly when the artifact exists, and the host
      # is built at module scope so a present-but-broken addon fails the file
      # instead of quietly skipping the leg.
      - name: Require the built addon the parity specs probe for
        run: |
          set -euo pipefail
          addon=crates/sourdaw-native/sourdaw-native.node
          if [ ! -f "$addon" ]; then
            printf 'the parity specs probe %s and would skip: the build step left nothing there\n' "$addon" >&2
            exit 1
          fi

      # This leg exists to make the parity proof decide a merge, so it must
      # fail hard: a leg that cannot fail decides nothing.
      # Three spec files, so a fourth worker would idle.
      - name: Run the addon parity specs
        env:
          VITEST_MAX_WORKERS: 3
        run: >-
          pnpm run test:run
          src/modules/AudioEngine/useCases/livePlayback/__tests__/projectLiveGraphProgrammeParity.spec.ts
          src/modules/AudioEngine/useCases/offlineRender/__tests__/renderOfflineNativeParity.spec.ts
          src/modules/AudioEngine/useCases/offlineRender/__tests__/liveOfflineNullTest.spec.ts

  dependency-review:
    name: Dependency review
    needs: decide
    # Every PR scans immutable base/head refs before the required Gate succeeds.
    if: github.event.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No checkout: the action compares the two refs through the API and reads
      # a working-tree file only for an explicit `config-file`, so a checkout
      # here would only park head-controlled content next to a persisted
      # credential in a base-context run.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

  pr-secrets:
    name: PR diff secret scan
    needs: decide
    # Scan the PR delta with trusted base configuration; nightly scans full history.
    if: github.event.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout trusted scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-scanner
          persist-credentials: false

      - name: Checkout scan target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Leaving repository unset keeps origin at the base repository. The
          # pinned head SHA is valid for both same-repository and fork PRs;
          # the next step fetches the independently pinned base SHA there.
          ref: ${{ github.event.pull_request.head.sha }}
          path: scan-target
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch immutable base SHA
        working-directory: scan-target
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Install trusted Gitleaks
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          umask 077
          gitleaks_archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          gitleaks_dir="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          gitleaks_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --output "$gitleaks_archive" \
            "$gitleaks_url"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$gitleaks_archive" | sha256sum --check --status
          mkdir -p "$gitleaks_dir"
          tar -xzf "$gitleaks_archive" -C "$gitleaks_dir" gitleaks
          printf '%s\n' "$gitleaks_dir" >> "$GITHUB_PATH"

      - name: Validate PR merge diff secret scanner
        working-directory: ${{ github.workspace }}
        env:
          GITLEAKS_EXPECTED_LEAK_EXIT_CODE: 79
        run: |
          set -euo pipefail
          umask 077
          positive_control_repo=$(mktemp -d "$RUNNER_TEMP/gitleaks-pr-merge-control.XXXXXX")
          trap 'rm -rf "$positive_control_repo"' EXIT

          git -C "$positive_control_repo" init --initial-branch=main
          git -C "$positive_control_repo" config user.email sourdaw-ci@example.invalid
          git -C "$positive_control_repo" config user.name 'Sourdaw CI'
          mkdir -p "$positive_control_repo/public/wasm"
          printf 'base side\n' > "$positive_control_repo/public/wasm/fixture.js"
          git -C "$positive_control_repo" add public/wasm/fixture.js
          git -C "$positive_control_repo" commit -m 'base fixture'
          base_sha=$(git -C "$positive_control_repo" rev-parse HEAD)
          git -C "$positive_control_repo" checkout -b fixture-branch
          printf 'branch side\n' > "$positive_control_repo/public/wasm/fixture.js"
          git -C "$positive_control_repo" commit -am 'branch fixture'
          git -C "$positive_control_repo" checkout main
          printf 'main side\n' > "$positive_control_repo/public/wasm/fixture.js"
          git -C "$positive_control_repo" commit -am 'main fixture'
          set +e
          git -C "$positive_control_repo" merge --no-ff fixture-branch
          merge_status=$?
          set -e
          if [ "$merge_status" -eq 0 ]; then
            printf 'expected merge fixture to require a merge-resolution commit\n' >&2
            exit 1
          fi
          synthetic_access_key=$(printf '%s%s%s' 'AKIA' 'QAZ2WSX3' 'EDC4RFV5')
          printf 'aws_access_key_id = "%s" // gitleaks:allow\n' "$synthetic_access_key" > "$positive_control_repo/public/wasm/fixture.js"
          cat > "$positive_control_repo/.gitleaks.toml" <<'GITLEAKS_CONFIG'
          title = "Untrusted suppression fixture"

          [extend]
          useDefault = true

          [allowlist]
          description = "Would suppress every finding if target-root config were loaded"
          regexes = ['''.*''']
          GITLEAKS_CONFIG
          git -C "$positive_control_repo" add public/wasm/fixture.js .gitleaks.toml
          git -C "$positive_control_repo" commit --no-edit
          head_sha=$(git -C "$positive_control_repo" rev-parse HEAD)

          set +e
          gitleaks git \
            --config "$GITHUB_WORKSPACE/trusted-scanner/.gitleaks.toml" \
            --gitleaks-ignore-path "$GITHUB_WORKSPACE/trusted-scanner/.gitleaksignore" \
            --ignore-gitleaks-allow \
            --no-banner \
            --no-color \
            --redact=100 \
            --verbose \
            --exit-code="$GITLEAKS_EXPECTED_LEAK_EXIT_CODE" \
            --log-opts="$base_sha..$head_sha -m" \
            "$positive_control_repo/.git"
          positive_control_status=$?
          set -e

          if [ "$positive_control_status" -ne "$GITLEAKS_EXPECTED_LEAK_EXIT_CODE" ]; then
            printf 'expected merge-diff Gitleaks positive control to exit %s, got %s\n' \
              "$GITLEAKS_EXPECTED_LEAK_EXIT_CODE" \
              "$positive_control_status" >&2
            exit 1
          fi

      - name: Scan pull request diff for secrets
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          gitleaks git \
            --config "$GITHUB_WORKSPACE/trusted-scanner/.gitleaks.toml" \
            --gitleaks-ignore-path "$GITHUB_WORKSPACE/trusted-scanner/.gitleaksignore" \
            --ignore-gitleaks-allow \
            --no-banner \
            --no-color \
            --redact=100 \
            --verbose \
            --exit-code=1 \
            --log-opts="$BASE_SHA..$HEAD_SHA -m" \
            "$GITHUB_WORKSPACE/scan-target/.git"

  validation-gate:
    name: Validation result
    if: ${{ always() }}
    needs:
      - decide
      - static
      - lint
      - boundaries
      - unit
      - tooling-unit
      - smoke
      - build
      - rust
      - native-macos
      - native-windows
      - native-parity
      - dependency-review
      - pr-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected validation jobs to succeed
        if: ${{ always() }}
        env:
          RESULTS: ${{ toJSON(needs) }}
          PULL_REQUEST: ${{ github.event.pull_request != null }}
        run: |
          set -euo pipefail
          printf '%s' "$RESULTS" | jq -e --arg pr "$PULL_REQUEST" '
            def selected($flag):
              if $flag == "true" then "success"
              elif $flag == "false" then "skipped"
              else error("missing scope verdict") end;
            (keys | sort) == (["decide", "static", "lint", "boundaries", "unit", "tooling-unit", "smoke", "build", "rust", "native-macos", "native-windows", "native-parity", "dependency-review", "pr-secrets"] | sort) and
            .decide.result == "success" and .static.result == "success" and
            (.decide.outputs | [.rust, .server, .e2e, .web, .code, .tooling] | all(. == "true" or . == "false")) and
            .lint.result == selected(.decide.outputs.code) and
            .boundaries.result == selected(.decide.outputs.code) and
            .unit.result == selected(.decide.outputs.web) and
            .["tooling-unit"].result == selected(.decide.outputs.tooling) and
            .build.result == selected(.decide.outputs.web) and
            .rust.result == (if .decide.outputs.rust == "true" or .decide.outputs.server == "true" then "success" else "skipped" end) and
            .["native-macos"].result == selected(.decide.outputs.rust) and
            .["native-windows"].result == selected(.decide.outputs.rust) and
            .["native-parity"].result == (if .decide.outputs.rust == "true" or .decide.outputs.web == "true" then "success" else "skipped" end) and
            .smoke.result == (if $pr == "true" then selected(.decide.outputs.e2e) elif $pr == "false" then "skipped" else error("missing PR verdict") end) and
            .["dependency-review"].result == selected($pr) and
            .["pr-secrets"].result == selected($pr)'
