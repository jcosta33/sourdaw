name: Feature
description: Small enhancement that does not change a public contract. Use Spec when behavior must become acceptance criteria.
title: "feat(scope): "
labels: ["enhancement", "status:ready"]
body:
  - type: markdown
    attributes:
      value: |
        Titles follow `feat(scope): description`. Consequential behavior uses Spec.

        After create, add `priority:P*` to match the dropdown; this form cannot apply it. Unpublished or secret work stays in `~/.agents/artifacts` and is not filed.

  - type: dropdown
    id: scope
    attributes:
      label: Subsystem Scope
      description: What subsystem or bounded context will own this capability?
      options:
        - audio-engine (Realtime scheduling, offline render, backends)
        - daw-dsp (Synthesizers, modular DSP, audio effects)
        - electron (Desktop shell, IPC, window management)
        - native (Rust native addons, platform audio device layers)
        - plugin-host (CLAP/VST3 hosting, scanning, isolation)
        - midi (MPE, MIDI 2.0, controller mapping)
        - arrangement (Timeline, clips, automation, composition)
        - yeast / bacteria / knead / levain / crumbs (Instruments & processors)
        - ai / airuntime (AI agentic workflows & tooling)
        - workspace-shell / ui (Presentation components, mixer, meters)
        - build (Tooling, build scripts, packaging)
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P2
        - P1
        - P3
    validations:
      required: true

  - type: textarea
    id: intent
    attributes:
      label: Intent
      description: One or two sentences. What becomes true, for whom. No API contract and no AC-NNN.
    validations:
      required: true

  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Observable finish condition. Not a spec requirement.
    validations:
      required: true
