name: Campaign
description: Multi-PR objective with a completion contract. Children carry status.
title: "feat(campaign): "
labels: ["epic", "status:tracking"]
body:
  - type: markdown
    attributes:
      value: |
        Ledger only. Execute on child Spec, Task, Bug, or Change plan issues. Secrets stay in `~/.agents/artifacts`.

        No live SHAs, counts, occupancy, or checkboxes. After create: add `priority:P*`; attach children as sub-issues.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: One durable outcome.
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: Completion contract
      description: Observable conditions that prove the campaign done.
    validations:
      required: true

  - type: textarea
    id: authorities
    attributes:
      label: Authorities
      description: Governing ADRs, spec issues, merge owner, and the reject mechanism.
      placeholder: "ADR 0021. Merge through pnpm deliver. Isolation — workers cannot push to main."
    validations:
      required: true

  - type: textarea
    id: operating_loop
    attributes:
      label: Operating loop
      description: Edit only if this campaign differs. Repeat a step only after state changed, the last attempt failed, or independent proof requires it.
      value: |
        1. Read this campaign and every authority.
        2. Reconcile repository, ledger, pull-request, worktree, worker, and verification state from live evidence.
        3. Repair ledger drift before trusting status.
        4. Select the highest-priority dependency-ready work that fits current capacity.
        5. Execute through implementation, verification, review, and integration gates.
        6. Record durable progress on child issues, not in this body.
        7. Repeat until the completion contract passes or a named stop blocks progress.
    validations:
      required: true

  - type: textarea
    id: stops
    attributes:
      label: Stops
      description: Named human decisions that block dependent work. Independent work continues.
    validations:
      required: true

  - type: textarea
    id: children
    attributes:
      label: Child issues
      description: Bare issue numbers. No task-list checkboxes.
      placeholder: |
        #123
        #124
    validations:
      required: false

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Only if Objective does not already bound the work.
    validations:
      required: false
