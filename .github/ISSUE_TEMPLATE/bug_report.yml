name: Bug report
description: Unspecced defect, crash, or audit finding. Use Task when implementing a slice of a ready Spec.
title: "fix(scope): "
labels: ["bug", "status:ready"]
body:
  - type: markdown
    attributes:
      value: |
        Titles follow `fix(scope): description`. Spec-governed work uses Task.

        After create, add `priority:P*` to match the dropdown; this form cannot apply it. Unpublished or secret work stays in `~/.agents/artifacts` and is not filed.

  - type: dropdown
    id: scope
    attributes:
      label: Subsystem Scope
      description: What subsystem or bounded context is affected?
      options:
        - audio-engine (Realtime scheduling, offline render, buffers)
        - daw-dsp (Synthesizers, filters, delay, reverbs, saturation)
        - electron (Desktop shell, IPC, window management, native addon)
        - native (crates/sourdaw-native, audio backends)
        - plugin-host (CLAP/VST3 hosting, scanning, isolation)
        - midi (MPE, MIDI 2.0, routing, clock sync)
        - arrangement (Timeline, clips, tracks, automation, transport)
        - yeast / bacteria / knead / levain / crumbs (Instruments & processors)
        - ai / airuntime (AI agentic tools, proposals, streaming)
        - workspace-shell / ui (Presentation components, mixer, piano roll)
        - build / ci (TypeScript, Rust, WASM, bundling)
        - security (CSP, sandbox, memory safety)
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Severity / Priority
      description: Select the appropriate severity level.
      options:
        - P1
        - P2
        - P3
        - P0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Defect Description
      description: What is happening versus what is expected?
      placeholder: "Clear description of the observed behavior and the expected contract."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps, code snippets, or test commands to reproduce the issue.
      placeholder: "1. Open project...\n2. Route track...\n3. Observe..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Architectural Context & References
      description: Relevant ADRs or related issues.
      placeholder: "ADR 0020, #2037"
    validations:
      required: false
