name: Task
description: One write-disjoint slice of a ready Spec. A Change plan may supplement; it cannot replace the Spec.
title: "task(scope): "
labels: ["status:ready"]
body:
  - type: markdown
    attributes:
      value: |
        The parent Spec must already be open. A Change plan may supplement it; it cannot replace it. One source and one implementer is not a Task — use Bug or Feature.

        Copy each assigned Spec AC block verbatim. After create, add this issue as a GitHub sub-issue of the Spec (the parent number field does not create that edge), and add `priority:P*`. Unpublished work stays in `~/.agents/artifacts`.

  - type: input
    id: parent_spec
    attributes:
      label: Parent Spec
      description: Issue number of the ready Spec. Required. After filing, attach this Task as a sub-issue of that Spec.
      placeholder: "2037"
    validations:
      required: true

  - type: input
    id: change_plan
    attributes:
      label: Change plan
      description: Issue number of the Change plan if this wave comes from one. Leave empty when there is none.
      placeholder: "2040"
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Subsystem
      options:
        - audio-engine
        - daw-dsp
        - electron
        - native
        - plugin-host
        - midi
        - arrangement
        - transport
        - yeast / bacteria / knead / levain / crumbs / grinder / grand-boule / fermenter
        - ai
        - workspace-shell / ui
        - security
        - build
        - cross-cutting
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Assigned requirements
      description: Paste each scoped Spec AC block and its Verify with line verbatim. Preservation guarantees go in Preservation scope, not here.
      placeholder: |
        ### AC-001
        - When:
        - Then:
        - Verify with:
    validations:
      required: true

  - type: textarea
    id: affected_areas
    attributes:
      label: Affected areas
      description: Every path this packet may write. Unknown scope conflicts with every other Task.
    validations:
      required: true

  - type: textarea
    id: do_not_change
    attributes:
      label: Do not change
      description: Excluded paths, contracts, and behavior.
    validations:
      required: true

  - type: textarea
    id: siblings
    attributes:
      label: May run with
      description: Other Task issue numbers proven write-disjoint with this packet, or None.
      placeholder: "None"
    validations:
      required: true

  - type: textarea
    id: preservation
    attributes:
      label: Preservation scope
      description: When a Change plan exists, copy every preservation guarantee this packet could violate, with its check. Otherwise None.
      placeholder: "None"
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: Verify
      description: One command (or justified n/a) per assigned requirement and preservation guarantee. Put evidence on the pull request, not in this body.
      placeholder: "pnpm test:run path/to/spec.ts"
    validations:
      required: true
