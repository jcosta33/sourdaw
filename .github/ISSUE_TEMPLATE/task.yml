name: Task
description: One write-disjoint slice of a ready Spec or Change plan. Not a second backlog.
title: "task(scope): "
labels: ["status:ready"]
body:
  - type: markdown
    attributes:
      value: |
        The parent Spec or Change plan must already be open. One source and one implementer is not a Task — use Bug or Feature.

        Copy each assigned AC block verbatim. Do not invent or weaken requirements. Link this issue as a child of the parent after filing.

  - type: input
    id: parent
    attributes:
      label: Parent issue
      description: Number of the ready Spec or Change plan this packet implements.
      placeholder: "2037"
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Subsystem
      options:
        - audio-engine
        - daw-dsp
        - electron
        - native
        - plugin-host
        - midi
        - arrangement
        - transport
        - yeast / bacteria / knead / levain / crumbs / grinder / grand-boule / fermenter
        - ai
        - workspace-shell / ui
        - security
        - build
        - cross-cutting
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Assigned requirements
      description: Paste each scoped AC (or PG) block and its Verify with line verbatim from the parent.
      value: |
        ### AC-001
        - When:
        - Then:
        - Verify with:
    validations:
      required: true

  - type: textarea
    id: do_not_change
    attributes:
      label: Do not change
      description: Excluded paths, contracts, and behavior.
    validations:
      required: true

  - type: textarea
    id: preservation
    attributes:
      label: Preservation scope
      description: Required when the parent is a Change plan. Copy every preservation guarantee this packet could violate. Omit with "None" when there is no change plan.
      placeholder: "None"
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: Verify
      description: One command (or justified n/a) per assigned requirement and preservation guarantee. Put evidence on the pull request, not in this body.
      placeholder: "pnpm test:run path/to/spec.ts"
    validations:
      required: true
