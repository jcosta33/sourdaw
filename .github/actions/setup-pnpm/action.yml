name: Set up verified native pnpm
description: Install the project-pinned native pnpm release through an integrity-pinned official bootstrap
inputs:
  package_json_file:
    description: Physical project manifest relative to the workspace; symbolic links are refused
    default: package.json
  dest:
    description: Empty owned tool directory; otherwise a fresh runner temporary directory is used
outputs:
  bin_dest:
    description: Verified target executable directory
    value: ${{ steps.install.outputs.bin_dest }}
  dest:
    description: Independent tool directory
    value: ${{ steps.install.outputs.dest }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.13.1
        package-manager-cache: false
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../scripts/setupPnpm.ts" --prepare-node
    - id: install
      shell: bash
      env:
        SOURDAW_PNPM_MANIFEST: ${{ inputs.package_json_file }}
        SOURDAW_PNPM_DEST: ${{ inputs.dest }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/setupPnpm.ts"
