version: 2
updates:
  # Version pull requests are open again: hosted checks verify an update now,
  # which is what made them not worth opening before.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "security"

  # Same for the Cargo tree.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "security"
