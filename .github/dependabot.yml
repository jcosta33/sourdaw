version: 2
updates:
  # Keep npm metadata for security updates; routine version PRs are disabled.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "security"

  # Keep Cargo metadata for security updates; routine version PRs are disabled.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "security"
